<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>三年级语文大冒险</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#fff8e8,#eaf7ff);color:#263238}.app{max-width:760px;margin:auto;min-height:100vh;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.brand{font-size:22px;font-weight:900}.stats{display:flex;gap:6px}.pill{background:#fff;border-radius:99px;padding:7px 10px;box-shadow:0 3px 12px #0001;font-size:13px}.hero,.panel,.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 7px 25px #00000012}.hero{margin-bottom:14px}.hero h1{margin:0 0 8px;font-size:29px}.hero p{color:#607d8b;line-height:1.6}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.toolbar input{flex:1;min-width:180px;padding:11px;border:1px solid #dce5ea;border-radius:12px}.primary,.secondary{border:0;border-radius:13px;padding:11px 15px;font-weight:800}.primary{background:#ff9f43;color:white}.secondary{background:#eef3f7;color:#455a64}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.card{min-height:154px;padding:15px}.card h3{margin:0 0 5px}.card p{font-size:13px;color:#78909c}.badge{float:right;font-size:27px}.stars{color:#ffb300;font-weight:800;margin:9px 0}.progress{height:9px;background:#e8eef2;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#66bb6a}.question{font-size:20px;font-weight:800;line-height:1.55;margin:15px 0}.options{display:grid;gap:9px}.option{padding:13px;border:2px solid transparent;border-radius:14px;background:#f5f8fa;text-align:left}.correct{border-color:#66bb6a;background:#effaf0}.wrong{border-color:#ef5350;background:#fff0ef}.option:disabled{opacity:1}.feedback{margin:12px 0;padding:12px;border-radius:12px}.ok{background:#edf8ef;color:#2e7d32}.bad{background:#fff0ef;color:#c62828}.hidden{display:none!important}.center{text-align:center}.mistake{margin:9px 0;padding:11px;border-left:5px solid #ff9f43;background:#fafafa;border-radius:9px}.locked{opacity:.55;filter:grayscale(.4)}.small{font-size:12px;color:#78909c}@media(max-width:480px){.grid{grid-template-columns:1fr}.hero h1{font-size:25px}.question{font-size:18px}.brand{font-size:19px}}
</style></head>
<body><div class="app">
<div class="top"><div class="brand">📚 三年级语文大冒险</div><div class="stats"><span class="pill">⭐ <b id="stars">0</b></span><span class="pill">🪙 <b id="coins">0</b></span></div></div>
<section id="home"><div class="hero"><h1>今天也来闯一关！</h1><p>把生字、词语、课文和阅读理解变成小游戏。答对得星星，错题自动保存到错题本。</p><div class="toolbar"><input id="name" placeholder="输入孩子名字（可选）"><button class="primary" onclick="saveName()">开始冒险 🚀</button></div><div class="toolbar"><button class="secondary" onclick="showMistakes()">📕 错题本</button><button class="secondary" onclick="daily()">🎁 今日挑战</button><button class="secondary" onclick="resetAll()">重置记录</button></div></div><div class="grid" id="levels"></div></section>
<section id="game" class="hidden"><div class="toolbar"><button class="secondary" onclick="goHome()">← 返回地图</button><span class="pill" id="levelTitle"></span><span class="pill">题目 <b id="qNo">1</b>/8</span></div><div class="panel"><div class="stars" id="qStars"></div><div class="question" id="question"></div><div class="options" id="options"></div><div id="feedback"></div><button id="nextBtn" class="primary hidden" onclick="nextQuestion()">下一题 →</button></div></section>
<section id="result" class="hidden"><div class="panel center"><div style="font-size:56px">🏆</div><h1 id="resultTitle">闯关成功！</h1><p id="resultText"></p><div class="stars" id="resultStars"></div><button class="primary" onclick="goHome()">回到地图</button> <button class="secondary" onclick="replay()">再来一次</button></div></section>
<section id="mistakes" class="hidden"><div class="toolbar"><button class="secondary" onclick="goHome()">← 返回</button></div><div class="panel"><h2>📕 错题本</h2><p id="mistakeCount"></p><div id="mistakeList"></div></div></section>
</div>
<script>
const levels=[['字词森林','重点生字词与词语','🌳'],['燕子小镇','课文理解挑战','🐦'],['荷花池','观察与想象','🪷'],['昆虫王国','词语搭配与观察','🦋'],['寓言村','故事道理','🦊'],['宇宙探险','科普阅读','🚀'],['传统文化岛','积累与运用','🏮'],['阅读城堡','阅读理解方法','🏰']];
const bank=[

[['“翩翩起舞”最适合描写？',['蝴蝶','石头','书本','桌子'],0],['“轻盈”通常可以形容？',['动作或身体轻巧','声音巨大','天气炎热','颜色黑暗'],0],['“昆虫”属于哪一类词？',['事物名称','动作','颜色','数量'],0],['观察昆虫时，首先应该？',['细致观察外形和动作','随意伤害它们','只看名字','闭上眼睛'],0],['“独角仙”是一种？',['昆虫','鸟类','鱼类','植物'],0],['下列哪个词语搭配最恰当？',['飞舞的蝴蝶','飞舞的石头','歌唱的铅笔','游泳的太阳'],0],['写观察日记可以记录？',['时间、地点、外形、动作和发现','只写一句话','只写天气','只写姓名'],0],['发现有趣的小昆虫时，最好的做法是？',['文明观察、保护环境','捕捉大量昆虫','破坏它的家','随意带走'],0]],
[['寓言故事通常有什么特点？',['通过故事说明道理','只介绍天气','只写景色','只列数字'],0],['“掩耳盗铃”告诉我们？',['不能自欺欺人','铃铛很好听','耳朵很重要','做事要快'],0],['“亡羊补牢”的“牢”在故事中指？',['羊圈','监牢','牢固','房间'],0],['读寓言时应该重点寻找？',['故事中的道理','作者年龄','页码','插图颜色'],0],['如果犯了错误，正确的态度是？',['及时改正','假装没发生','责怪别人','继续犯错'],0],['寓言中的动物常常？',['被赋予人的思想和行为','完全不会行动','只出现一次','不能说话'],0],['“刻舟求剑”说明？',['情况变化了，办法也要调整','船一定很快','剑很锋利','水很深'],0],['把寓言道理用自己的话说出来，属于？',['理解与概括','机械抄写','朗读比赛','计算'],0]],
[['太阳属于？',['恒星','行星','卫星','彗星'],0],['地球绕着什么运动？',['太阳','月亮','火星','北斗七星'],0],['科普文章常用的表达方式是？',['准确说明事实','只写夸张故事','只写对话','只写诗歌'],0],['“因为……所以……”重点表示？',['因果关系','颜色关系','人物关系','时间单位'],0],['科学文字概括主要内容最好的方法是？',['抓住关键词和中心意思','逐字背下来','只看第一句','只看最后一个字'],0],['做阅读理解时，答案最好？',['有文章依据','完全凭感觉','越长越好','越复杂越好'],0],['遇到说明性文字，值得关注？',['事实、特点和原因','人物穿什么','故事结尾是否感人','对话语气'],0],['遇到不懂的词应该？',['联系上下文或查资料','直接跳过所有内容','猜一个就算','不再阅读'],0]],
[['“清明时节雨纷纷”描写的是哪个节日？',['清明节','春节','端午节','中秋节'],0],['端午节常见的习俗是？',['赛龙舟、吃粽子','赏月','贴春联','堆雪人'],0],['“文房四宝”指？',['笔墨纸砚','琴棋书画','梅兰竹菊','柴米油盐'],0],['“雅人四好”通常指？',['琴棋书画','笔墨纸砚','梅兰竹菊','风雨雷电'],0],['学习传统文化时应该？',['理解含义并积累运用','只背名称','完全不理解','只看图片'],0],['下列属于寓意美好的词语是？',['吉祥如意','乱七八糟','怒气冲冲','东倒西歪'],0],['积累古诗时，最有效的方法是？',['理解画面后再背诵','只读最后一句','只看标题','不读全文'],0],['把学到的成语用进句子，可以帮助？',['真正掌握词语','忘记词义','减少阅读','避免思考'],0]],
[['短文阅读第一步通常应该？',['通读全文，了解大意','直接看最后一道题','只看插图','只读第一句'],0],['题目问“为什么”，答案通常要找？',['原因和依据','人物姓名','标点数量','段落颜色'],0],['题目问“主要内容”，应该？',['概括文章中心意思','抄整篇文章','只写一个词','只写标题'],0],['“他急得像热锅上的蚂蚁”用了什么修辞？',['比喻','拟人','排比','设问'],0],['阅读中遇到“可是、但是”，通常表示？',['转折','并列','因果','递进'],0],['判断题答案最好根据？',['原文证据','个人想象','题目长短','运气'],0],['第一次没答对，最好的办法是？',['看解析，找错因，再做一次','马上退出','记住答案但不理解','跳过所有题'],0],['提高阅读理解最需要坚持什么？',['每天读一点并认真思考','只做难题','只背答案','不读课外文章'],0]]
];
let data=JSON.parse(localStorage.getItem('grade3Adventure')||'{"name":"","stars":0,"coins":0,"done":{},"mistakes":[]}'),cur=0,qi=0,score=0;
function save(){localStorage.setItem('grade3Adventure',JSON.stringify(data));updateStats()}function updateStats(){$('stars').textContent=data.stars;$('coins').textContent=data.coins}function $(id){return document.getElementById(id)}
function renderLevels(){let s='';levels.forEach((x,i)=>{let done=data.done[i]||0,locked=i>0&&!data.done[i-1];s+=`<div class="card ${locked?'locked':''}"><span class="badge">${locked?'🔒':x[2]}</span><h3>第${i+1}关 · ${x[0]}</h3><p>${x[1]}</p><div class="stars">${'⭐'.repeat(Math.min(done,3))}${'☆'.repeat(3-Math.min(done,3))}</div><div class="progress"><i style="width:${done?100:0}%"></i></div><button class="${locked?'secondary':'primary'}" ${locked?'disabled':''} onclick="start(${i})">${locked?'未解锁':done?'再挑战':'开始闯关'}</button></div>`});$('levels').innerHTML=s;updateStats()}
function hideAll(){['home','game','result','mistakes'].forEach(id=>$(id).classList.add('hidden'))}function goHome(){hideAll();$('home').classList.remove('hidden');$('name').value=data.name||'';renderLevels()}function saveName(){data.name=$('name').value.trim();save()}
function start(i){cur=i;qi=0;score=0;hideAll();$('game').classList.remove('hidden');$('levelTitle').textContent=levels[i][2]+' '+levels[i][0];showQuestion()}
function showQuestion(){let x=bank[cur][qi];$('qNo').textContent=qi+1;$('qStars').textContent='本关得分：'+score+' ⭐';$('question').textContent=x[0];$('feedback').innerHTML='';$('nextBtn').classList.add('hidden');$('options').innerHTML=x[1].map((v,i)=>`<button class="option" onclick="answer(${i},this)">${'ABCD'[i]}. ${v}</button>`).join('')}
function answer(i,btn){let x=bank[cur][qi];document.querySelectorAll('.option').forEach(b=>b.disabled=true);if(i===x[2]){btn.classList.add('correct');score++;data.stars++;data.coins+=2;$('feedback').innerHTML='<div class="feedback ok">🎉 答对啦！获得 1 颗星星 + 2 金币。</div>'}else{btn.classList.add('wrong');document.querySelectorAll('.option')[x[2]].classList.add('correct');data.mistakes.unshift({level:cur,q:x[0],a:x[1][x[2]],time:new Date().toLocaleString()});data.mistakes=data.mistakes.slice(0,100);$('feedback').innerHTML='<div class="feedback bad">💡 正确答案：'+x[1][x[2]]+'。看懂以后再记，会更牢哦！</div>'}save();$('nextBtn').classList.remove('hidden');$('nextBtn').textContent=qi===7?'查看成绩 🏆':'下一题 →'}
function nextQuestion(){if(qi<7){qi++;showQuestion()}else finish()}function finish(){data.done[cur]=Math.max(data.done[cur]||0,score>=6?3:score>=4?2:1);save();hideAll();$('result').classList.remove('hidden');$('resultText').textContent=(data.name?data.name+'，':'')+'你完成了“'+levels[cur][0]+'”！答对 '+score+'/8 题。';$('resultStars').textContent='⭐'.repeat(score>=6?3:score>=4?2:1);$('resultTitle').textContent=score>=6?'太棒了！通关成功 🎉':score>=4?'完成挑战！继续加油 💪':'挑战完成！再试一次会更厉害 🌟'}function replay(){start(cur)}
function showMistakes(){hideAll();$('mistakes').classList.remove('hidden');$('mistakeCount').textContent='目前有 '+data.mistakes.length+' 道错题记录。';$('mistakeList').innerHTML=data.mistakes.length?data.mistakes.map((m,i)=>`<div class="mistake"><b>${i+1}. 第${m.level+1}关</b><br>${m.q}<br>正确答案：<strong>${m.a}</strong><br><span class="small">${m.time}</span></div>`).join(''):'<div class="center">🎉 暂时没有错题，继续保持！</div>'}function daily(){start(new Date().getDate()%levels.length)}function resetAll(){if(confirm('确定清除所有学习记录吗？')){localStorage.removeItem('grade3Adventure');location.reload()}}
$('name').value=data.name||'';renderLevels();
</script></body></html>
