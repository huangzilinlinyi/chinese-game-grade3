<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fff7e6">
<title>三年级语文大冒险</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Microsoft YaHei",
    sans-serif;
  background:linear-gradient(135deg,#fff8e8,#eaf7ff);
  color:#263238;
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
  touch-action:manipulation;
}

.app{
  width:100%;
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding:12px;
}

/* 顶部 */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}

.brand{
  font-size:21px;
  font-weight:900;
}

.stats{
  display:flex;
  gap:6px;
}

.pill{
  background:#fff;
  border-radius:999px;
  padding:7px 10px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  font-size:13px;
  white-space:nowrap;
}

/* 首页 */

.hero,
.panel,
.card{
  background:#fff;
  border-radius:22px;
  padding:18px;
  box-shadow:0 7px 25px rgba(0,0,0,.07);
}

.hero{
  margin-bottom:14px;
}

.hero h1{
  margin:0 0 8px;
  font-size:28px;
}

.hero p{
  color:#607d8b;
  line-height:1.65;
  margin:8px 0;
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:10px 0;
}

.toolbar input{
  flex:1;
  min-width:180px;
  padding:12px;
  border:1px solid #dce5ea;
  border-radius:12px;
  outline:none;
  font-size:15px;
}

.toolbar input:focus{
  border-color:#ff9f43;
}

/* 按钮 */

.primary,
.secondary{
  border:0;
  border-radius:13px;
  padding:12px 16px;
  font-weight:800;
  font-size:14px;
  min-height:44px;
}

.primary{
  background:#ff9f43;
  color:#fff;
  box-shadow:0 4px 10px rgba(255,159,67,.25);
}

.secondary{
  background:#eef3f7;
  color:#455a64;
}

.primary:active,
.secondary:active{
  transform:scale(.97);
}

/* 关卡 */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
}

.card{
  min-height:205px;
  padding:15px;
  position:relative;
}

.card h3{
  margin:0 45px 6px 0;
  font-size:17px;
}

.card p{
  font-size:13px;
  color:#78909c;
  line-height:1.5;
  min-height:40px;
}

.badge{
  position:absolute;
  right:14px;
  top:13px;
  font-size:29px;
}

.locked{
  opacity:.58;
  filter:grayscale(.45);
}

.unlocked{
  border:2px solid #ffe0b2;
}

.level-progress{
  margin:8px 0;
  font-size:12px;
  color:#78909c;
}

.progress{
  height:9px;
  background:#e8eef2;
  border-radius:999px;
  overflow:hidden;
  margin-top:5px;
}

.progress i{
  display:block;
  height:100%;
  background:#66bb6a;
  width:0;
  transition:.3s;
}

.stars{
  color:#ffb300;
  font-weight:800;
  margin:8px 0;
}

/* 阶段 */

.stage-bar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin:10px 0 15px;
}

.stage{
  text-align:center;
  padding:8px 3px;
  border-radius:10px;
  background:#eef3f7;
  color:#78909c;
  font-size:11px;
}

.stage.active{
  background:#ff9f43;
  color:#fff;
  font-weight:800;
}

.stage.done{
  background:#e8f5e9;
  color:#2e7d32;
}

/* 游戏 */

.game-head{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.game-head .grow{
  flex:1;
}

.question{
  font-size:21px;
  font-weight:900;
  line-height:1.55;
  margin:18px 0;
}

.question-type{
  color:#ff9f43;
  font-size:14px;
  font-weight:800;
}

.options{
  display:grid;
  gap:10px;
}

.option{
  width:100%;
  padding:14px;
  border:2px solid transparent;
  border-radius:15px;
  background:#f5f8fa;
  text-align:left;
  font-size:16px;
  line-height:1.45;
  color:#263238;
  min-height:52px;
  transition:.15s;
}

.option:hover{
  background:#edf3f6;
}

.option:active{
  transform:scale(.985);
}

.option.correct{
  border-color:#66bb6a;
  background:#effaf0;
  color:#2e7d32;
  font-weight:800;
}

.option.wrong{
  border-color:#ef5350;
  background:#fff0ef;
  color:#c62828;
}

.option:disabled{
  opacity:1;
  cursor:default;
}

.feedback{
  margin:14px 0;
  padding:13px;
  border-radius:13px;
  line-height:1.55;
  font-size:14px;
}

.ok{
  background:#edf8ef;
  color:#2e7d32;
}

.bad{
  background:#fff0ef;
  color:#c62828;
}

/* 结果 */

.result-icon{
  font-size:60px;
}

.center{
  text-align:center;
}

/* 错题本 */

.mistake{
  margin:10px 0;
  padding:12px;
  border-left:5px solid #ff9f43;
  background:#fafafa;
  border-radius:9px;
  line-height:1.6;
}

.small{
  font-size:12px;
  color:#78909c;
}

.hidden{
  display:none!important;
}

/* 手机 */

@media(max-width:520px){

  .app{
    padding:10px;
  }

  .brand{
    font-size:18px;
  }

  .pill{
    padding:6px 8px;
    font-size:12px;
  }

  .hero h1{
    font-size:24px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .card{
    min-height:190px;
  }

  .question{
    font-size:19px;
  }

  .option{
    font-size:16px;
    padding:15px 13px;
    min-height:56px;
  }

  .stage{
    font-size:10px;
    padding:7px 2px;
  }
}
</style>
</head>

      class="stage"

    </div>

    <div
      class="stage"
      id="stage3"

<!-- ================= 结果 ================= -->

<section

  <div class="panel center">

    </div>

    </h1>

    <p id="resultText"></p>

    <div

    ></div>

    <p id="resultReward"></p>

    <div class="toolbar">
      <button
        class="primary"
        id="homeBtn"
      >
        🗺️ 返回地图
      </button>

      <button
        class="secondary"
        id="replayBtn"
      >
        🔄 再挑战
      </button>
    </div>

  </div>

</section>


<!-- ================= 错题本 ================= -->

<section
  id="mistakes"
  class="hidden"

  <div class="toolbar">

    <button

      id="mistakeBackBtn"
    >

  <div class="panel">

      class="small"
    ></p>

    <div id="mistakeList"></div>

  </div>

</section>

</div>

  ],

  stage1:[
    {
      q:"学习词语时，怎样理解词语更准确？",
      options:["联系上下文理解","只看字形","随便猜","完全不理解"],
      answer:0,
      explain:"联系上下文是理解词语的重要方法。"
    },
    {
      q:"下面哪种方法有助于积累词语？",
      options:["把词语放进句子中使用","只读一次","完全不使用","只看拼音"],
      answer:0,
      explain:"在具体句子中使用词语，可以帮助真正掌握。"
    }
  ],

  stage2:[
    {
      q:"学习一篇课文，首先应该掌握什么？",
      options:["课文的主要内容","作者电话号码","页码颜色","插图编号"],
      answer:0,
      explain:"理解主要内容是学习课文的重要基础。"
    },
    {
      q:"课文中遇到不懂的地方应该怎么办？",
      options:["联系上下文思考","马上放弃","随便猜","不再阅读"],
      answer:0,
      explain:"可以联系上下文，也可以查资料帮助理解。"
    }
  ],

  stage3:[
    {
      q:"阅读理解题的答案最好来自哪里？",
      options:["文章中的依据","自己的猜测","题目长短","运气"],
      answer:0,
      explain:"阅读理解要根据文章内容寻找证据。"
    },
    {
      q:"题目问“主要内容”，应该怎么回答？",
      options:["概括文章中心意思","抄整篇文章","只写一个字","只写标题"],
      answer:0,
      explain:"主要内容需要用自己的话进行概括。"
    }
  ]

};


/* =========================================================
   自动补齐每篇课文
   ========================================================= */

function buildQuestionBank(){

  return levels.map(level => {

    const title = level[0];

    if(templates[title]){
      return templates[title];
    }

    const arr=[];

    for(let s=0;s<4;s++){

      const list=defaultQuestions["stage"+s];

      list.forEach(q=>{
        arr.push({
          stage:s,
          q:"【"+title+"】"+q.q,
          options:[...q.options],
          answer:q.answer,
          explain:q.explain
        });
      });

    }

    return arr;
  });

}

const bank=buildQuestionBank();


/* =========================================================
   数据
   ========================================================= */

const STORAGE_KEY="grade3AdventureV2";

let data;

try{

  data=JSON.parse(
    localStorage.getItem(STORAGE_KEY)
  );

}catch(e){

  data=null;

}

if(
  !data ||
  typeof data!=="object"
){

  data={
    name:"",
    stars:0,
    coins:0,
    done:{},
    mistakes:[]
  };

}

if(!data.done)data.done={};
if(!Array.isArray(data.mistakes))data.mistakes=[];

let currentLevel=0;
let currentQuestion=0;
let currentQuestions=[];
let currentScore=0;


/* =========================================================
   工具
   ========================================================= */

function $(id){
  return document.getElementById(id);
}


function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

  updateStats();
}


function updateStats(){

  $("stars").textContent=data.stars;
  $("coins").textContent=data.coins;

}


function hideAll(){

  [
    "home",
    "game",
    "result",
    "mistakes"
  ].forEach(id=>{
    $(id).classList.add("hidden");
  });

}


function goHome(){

  hideAll();

  $("home").classList.remove("hidden");

  $("name").value=data.name || "";

  renderLevels();

}


function saveName(){

  data.name=$("name").value.trim();

  saveData();

  renderLevels();

}


/* =========================================================
   关卡是否解锁
   ========================================================= */

function isUnlocked(index){

  if(index===0){
    return true;
  }

  return !!data.done[index-1];

}


/* =========================================================
   渲染关卡
   ========================================================= */

function renderLevels(){

  let html="";

  levels.forEach((level,index)=>{

    const done=data.done[index] || 0;
    const unlocked=isUnlocked(index);

    const percent=
      Math.min(
        100,
        Math.round((done/4)*100)
      );

    html+=`

      <div class="card ${unlocked?"unlocked":"locked"}">

        <span class="badge">
          ${unlocked ? level[2] : "🔒"}
        </span>

        <h3>
          第${index+1}关 · ${level[0]}
        </h3>

        <p>
          ${level[1]}
        </p>

        <div class="stars">
          ${"⭐".repeat(done)}
          ${"☆".repeat(4-done)}
        </div>

        <div class="level-progress">
          ${unlocked
            ? done>=4
              ? "🎉 已完成全部训练"
              : "🔓 已解锁"
            : "🔒 完成上一关后解锁"
          }
        </div>

        <div class="progress">
          <i style="width:${percent}%"></i>
        </div>

        <div style="margin-top:10px">

          <button
            class="${unlocked?"primary":"secondary"}"
            ${unlocked?"":"disabled"}
            onclick="startLevel(${index})"
          >
            ${
              unlocked
              ? done>=4
                ? "🔄 再挑战"
                : "🚀 开始闯关"
              : "🔒 未解锁"
            }
          </button>

        </div>

      </div>
    `;

  });

  $("levels").innerHTML=html;

  updateStats();

}


/* =========================================================
   随机打乱数组
   ========================================================= */

function shuffle(array){

  const arr=[...array];

  for(let i=arr.length-1;i>0;i--){

    const j=Math.floor(
      Math.random()*(i+1)
    );

    [arr[i],arr[j]]=[
      arr[j],
      arr[i]
    ];

  }

  return arr;

}


/* =========================================================
   开始关卡
   ========================================================= */

function startLevel(index){

  if(!isUnlocked(index)){

    alert("🔒 请先完成上一关！");
    return;

  }

  currentLevel=index;
  currentQuestion=0;
  currentScore=0;

  /*
   每次进入关卡都重新打乱题目
  */

  currentQuestions=shuffle(
    bank[index]
  );

  hideAll();

  $("game").classList.remove("hidden");

  $("levelTitle").textContent=
    levelEmoji(index)+" "+
    levels[index][0];

  showQuestion();

}


/* =========================================================
   Emoji
   ========================================================= */

function levelEmoji(index){

  return levels[index][2];

}


/* =========================================================
   显示题目
   ========================================================= */

function showQuestion(){

  const item=
    currentQuestions[currentQuestion];

  if(!item){

    finishLevel();
    return;

  }

  $("qNo").textContent=
    currentQuestion+1;

  $("qTotal").textContent=
    currentQuestions.length;

  $("question").textContent=
    item.q;

  $("questionType").textContent=
    getStageName(item.stage);

  $("qStars").textContent=
    "答对本题：⭐ +1　🪙 +2";

  $("feedback").innerHTML="";

  $("nextBtn").classList.add("hidden");

  updateStage(item.stage);


  /*
   =====================================================
   关键修复：
   对选项重新随机排列，同时保存正确答案对象。
   不再直接使用原来的 answer 下标。
   =====================================================
  */

  const optionObjects=
    item.options.map(
      (text,index)=>({

        text:text,

        correct:
          index===item.answer

      })
    );

  const shuffledOptions=
    shuffle(optionObjects);


  $("options").innerHTML=
    shuffledOptions.map(
      (option,index)=>`

        <button
          class="option"
          data-correct="${option.correct}"
          data-answer="${escapeHtml(option.text)}"
          onclick="selectAnswer(this)"
        >
          ${"ABCD"[index]}. ${escapeHtml(option.text)}
        </button>

      `
    ).join("");

}


/* =========================================================
   阶段名称
   ========================================================= */

function getStageName(stage){

  const names=[
    "🔤 生字训练",
    "📝 词语训练",
    "📖 课文理解",
    "📚 阅读理解"
  ];

  return names[stage] || "语文训练";

}


/* =========================================================
   阶段显示
   ========================================================= */

function updateStage(stage){

  for(let i=0;i<4;i++){

    const el=$("stage"+i);

    el.classList.remove(
      "active",
      "done"
    );

    if(i<stage){
      el.classList.add("done");
    }

    if(i===stage){
      el.classList.add("active");
    }

  }

}


/* =========================================================
   选择答案
   ========================================================= */

function selectAnswer(btn){

  /*
   防止重复点击
  */

  const buttons=
    document.querySelectorAll(".option");

  buttons.forEach(b=>{
    b.disabled=true;
  });


  const isCorrect=
    btn.dataset.correct==="true";


  const item=
    currentQuestions[currentQuestion];


  if(isCorrect){

    btn.classList.add("correct");

    currentScore++;

    data.stars++;
    data.coins+=2;

    $("feedback").innerHTML=`

      <div class="feedback ok">

        🎉 <b>答对啦！</b><br>

        ⭐ +1 星星　🪙 +2 积分

        ${
          item.explain
          ? "<br>💡 "+escapeHtml(item.explain)
          : ""
        }

      </div>

    `;

  }else{

    btn.classList.add("wrong");


    /*
     找出真正的正确答案
    */

    buttons.forEach(b=>{

      if(b.dataset.correct==="true"){

        b.classList.add("correct");

      }

    });


    const correctAnswer=
      item.options[item.answer];


    const selectedAnswer=
      btn.dataset.answer;


    data.mistakes.unshift({

      level:currentLevel,

      levelName:levels[currentLevel][0],

      stage:item.stage,

      question:item.q,

      selected:selectedAnswer,

      answer:correctAnswer,

      explain:item.explain || "",

      time:new Date().toLocaleString()

    });


    /*
     最多保存100道错题
    */

    data.mistakes=
      data.mistakes.slice(0,100);


    $("feedback").innerHTML=`

      <div class="feedback bad">

        ❌ <b>这次答错了</b><br>

        你的答案：
        ${escapeHtml(selectedAnswer)}<br>

        正确答案：
        <strong>${escapeHtml(correctAnswer)}</strong>

        ${
          item.explain
          ? "<br>💡 "+escapeHtml(item.explain)
          : ""
        }

      </div>

    `;

  }


  saveData();


  $("nextBtn").classList.remove("hidden");


  if(
    currentQuestion===
    currentQuestions.length-1
  ){

    $("nextBtn").textContent=
      "🏆 查看本关成绩";

  }else{

    $("nextBtn").textContent=
      "下一题 →";

  }

}


/* =========================================================
   下一题
   ========================================================= */

function nextQuestion(){

  if(
    currentQuestion<
    currentQuestions.length-1
  ){

    currentQuestion++;

    showQuestion();

  }else{

    finishLevel();

  }

}


/* =========================================================
   完成本关
   ========================================================= */

function finishLevel(){

  /*
   4星代表本关完成。
   每完成一次关卡就解锁下一关。
  */

  const starsEarned=
    currentScore>=
    Math.ceil(currentQuestions.length*.75)
    ?4
    :currentScore>=
      Math.ceil(currentQuestions.length*.5)
      ?3
      :currentScore>=
        Math.ceil(currentQuestions.length*.25)
        ?2
        :1;


  data.done[currentLevel]=Math.max(

    data.done[currentLevel] || 0,

    starsEarned

  );


  saveData();


  hideAll();

  $("result").classList.remove("hidden");


  $("resultTitle").textContent=
    starsEarned>=4
    ? "🎉 太棒了！本关完成！"
    : starsEarned>=3
      ? "👏 做得很好！"
      : "💪 挑战完成！继续练习";


  $("resultText").textContent=
    (data.name
      ? data.name+"，"
      : ""
    )+
    "你完成了《"+
    levels[currentLevel][0]+
    "》！本次答对 "+
    currentScore+
    "/"+
    currentQuestions.length+
    " 题。";


  $("resultStars").textContent=
    "⭐".repeat(starsEarned)+
    "☆".repeat(4-starsEarned);


  $("resultReward").innerHTML=
    `
      本次获得：
      ⭐ ${currentScore} 星星
     　
      🪙 ${currentScore*2} 积分
      <br><br>
      ${
        currentLevel<
        levels.length-1
        ? "🔓 下一关已经解锁！"
        : "🏆 恭喜你完成全部关卡！"
      }
    `;

}


/* =========================================================
   错题本
   ========================================================= */

function showMistakes(){

  hideAll();

  $("mistakes").classList.remove("hidden");

  const list=data.mistakes || [];


  $("mistakeCount").textContent=
    "目前共有 "+
    list.length+
    " 道错题。";


  if(!list.length){

    $("mistakeList").innerHTML=`

      <div class="center">

        🎉

        <p>
          目前还没有错题！
        </p>

        <p class="small">
          做错的题目会自动保存到这里。
        </p>

      </div>

    `;

    return;

  }


  $("mistakeList").innerHTML=
    list.map((m,index)=>`

      <div class="mistake">

        <b>
          ${index+1}. 第${m.level+1}关 ·
          ${escapeHtml(m.levelName || "")}
        </b>

        <br>

        <span class="small">
          ${getStageName(m.stage)}
        </span>

        <br><br>

        <strong>
          ${escapeHtml(m.question)}
        </strong>

        <br>

        ❌ 你的答案：
        ${escapeHtml(m.selected)}

        <br>

        ✅ 正确答案：
        <strong>
          ${escapeHtml(m.answer)}
        </strong>

        ${
          m.explain
          ? "<br>💡 "+escapeHtml(m.explain)
          : ""
        }

        <br>

        <span class="small">
          ${escapeHtml(m.time || "")}
        </span>

      </div>

    `).join("");

}


/* =========================================================
   今日挑战
   ========================================================= */

function daily(){

  const index=
    new Date().getDate()%
    levels.length;

  /*
   今日挑战如果还没有解锁，
   自动找当前已经解锁的关卡。
  */

  let target=index;

  if(!isUnlocked(target)){

    target=0;

    for(let i=0;i<levels.length;i++){

      if(isUnlocked(i)){
        target=i;
      }else{
        break;
      }

    }

  }

  startLevel(target);

}


/* =========================================================
   重置
   ========================================================= */

function resetAll(){

  const ok=
    confirm(
      "确定要清除全部学习记录吗？\n\n"+
      "星星、积分、关卡进度和错题本都会清除。"
    );

  if(!ok)return;

  localStorage.removeItem(STORAGE_KEY);

  location.reload();

}


/* =========================================================
   HTML安全处理
   ========================================================= */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   事件绑定
   ========================================================= */

$("startAdventureBtn")
  .addEventListener(
    "click",
    saveName
  );


$("mistakeBtn")
  .addEventListener(
    "click",
    showMistakes
  );


$("dailyBtn")
  .addEventListener(
    "click",
    daily
  );


$("resetBtn")
  .addEventListener(
    "click",
    resetAll
  );


$("backBtn")
  .addEventListener(
    "click",
    goHome
  );


$("mistakeBackBtn")
  .addEventListener(
    "click",
    goHome
  );


$("nextBtn")
  .addEventListener(
    "click",
    nextQuestion
  );


$("homeBtn")
  .addEventListener(
    "click",
    goHome
  );


$("replayBtn")
  .addEventListener(
    "click",
    ()=>{
      startLevel(currentLevel);
    }
  );


/* =========================================================
   初始化
   ========================================================= */

$("name").value=
  data.name || "";

renderLevels();

updateStats();

</script>

</html>
