<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>三年级下册语文·一课一卷</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(145deg,#eef7ff,#fff7e8);color:#263238;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.app{max-width:850px;margin:auto;padding:12px 12px 50px}.header{background:linear-gradient(135deg,#4b55c9,#37a8d8);color:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 30px #0002}.header h1{margin:0 0 7px;font-size:25px}.header p{margin:0;opacity:.94;font-size:13px;line-height:1.65}.panel{background:#fff;border-radius:22px;padding:17px;margin-top:12px;box-shadow:0 6px 25px #00000012}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.badge{background:#fff2b8;color:#8a6500;border-radius:99px;padding:7px 10px;font-weight:800;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:13px}.lesson{border:0;background:#f4f6ff;border-radius:16px;padding:14px;text-align:left;min-height:72px;color:#25304b;font-weight:800;cursor:pointer}.lesson:active,.btn:active{transform:scale(.98)}.unit{display:block;color:#5058c9;font-size:11px;margin-bottom:5px}.small{font-size:12px;color:#71808b;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.stat{background:#f7f9fc;border-radius:15px;text-align:center;padding:10px;font-size:12px}.num{font-size:21px;font-weight:900}.btn{border:0;border-radius:13px;padding:11px 15px;font-weight:900;cursor:pointer}.primary{background:#5058c9;color:#fff}.secondary{background:#edf1f6;color:#455a64}.hidden{display:none!important}.progress{height:9px;background:#e8edf2;border-radius:99px;overflow:hidden;margin:13px 0}.bar{height:100%;width:0;background:#55b96b;transition:.25s}.paperHead{background:#f7f8ff;border-radius:16px;padding:13px;margin:12px 0}.paperHead strong{font-size:18px}.questionCard{border:1px solid #e6ebf0;border-radius:16px;padding:14px;margin:12px 0;background:#fff}.qno{font-size:12px;color:#68 </style></head><body><div class="app"><header class="header"><h1>📚 三年级下册语文 · 一课一卷</h1><p>不设选择题，不靠乱点。每篇课文就是一张完整试卷：自己读题、自己书写答案，再统一提交。题目包含生字词、课文理解和阅读思考。</p></header><section id="home" class="panel"><div class="top"><div><h2 style="margin:0">📖 选择一张试卷</h2><div class="small">完成一张后可继续挑战下一张</div></div><span class="badge" id="lessonCount"></span></div><div class="stats"><div class="stat">⭐<div class="num" id="stars">0</div>星星</div><div class="stat">🏆<div class="num" id="finished">0</div>完成</div><div class="stat">📕<div class="num" id="mistakeNum">0</div>错题</div></div><div class="actions"><button class="btn secondary" onclick="showMistakes()">📕 错题本</button><button class="btn secondary" onclick="resetAll()">重置记录</button></div><div id="lessonGrid" class="grid"></div></section><section id="paper" class="panel hidden"><div class="top"><button class="btn secondary" onclick="goHome()">← 试卷列表</button><span class="badge" id="paperBadge"></span></div><div class="paperHead"><strong id="paperTitle"></strong><div class="small" id="paperInfo"></div></div><div class="progress"><div id="bar" class="bar"></div></div><div id="paperQuestions"></div><div class="submitBar"><div class="scoreBox" id="filledInfo">请认真完成全部题目后再交卷</div><div class="actions"><button class="btn primary" onclick="submitPaper()">📝 全部完成，提交试卷</button><button class="btn secondary" onclick="clearAnswers()">清空答案</button></div></div></section><section id="result" class="panel result hidden"><div class="big" id="resultTitle"></div><div class="stars" id="resultStars"></div><p id="resultText"></p><div id="resultReview"></div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="goHome()">返回试卷列表</button><button class="btn secondary" onclick="replay()">重新做这张</button></div></section><section id="mistakes" class="panel hidden"><div class="top"><h2>📕 我的错题本</h2><button class="btn secondary" onclick="goHome()">返回</button></div><p class="small" id="mistakeSummary"></p><div id="mistakeList"></div></section></div><script>
const lessons=[{"title":"第一单元 · 古诗三首","questions":[{"q":"《绝句》中描写燕子衔泥筑巢的句子与哪种动物有关？","opts":["燕子","蝴蝶","蜜蜂","鸳鸯"],"a":0,"type":"choice"},{"q":"《绝句》描写的季节是？","opts":["春天","夏天","秋天","冬天"],"a":0,"type":"choice"},{"q":"《惠崇春江晚景》中“竹外桃花三两枝”写的是哪一季的景色？","opts":["春天","夏天","秋天","冬天"],"a":0,"type":"choice"},{"q":"《惠崇春江晚景》中最早感知春天水温变化的是？","opts":["鸭子","燕子","鱼儿","青蛙"],"a":0,"type":"choice"},{"q":"《三衢道中》写诗人游三衢山时的心情主要是？","opts":["轻松愉快","悲伤难过","紧张害怕","孤独寂寞"],"a":0,"type":"choice"},{"q":"《三衢道中》中“梅子黄时”说明大约是什么时候？","opts":["初夏","深秋","寒冬","早春"],"a":0,"type":"choice"},{"q":"三首古诗都可以让我们感受到怎样的自然景象？","opts":["生机与美好","荒凉与寒冷","战争与悲壮","城市的繁华"],"a":0,"type":"choice"},{"q":"学习古诗时，最好的方法之一是？","opts":["结合画面和关键词理解","只背作者名字","只看注音不理解","把每个字都改成白话"],"a":0,"type":"choice"},{"q":"“泥融飞燕子，沙暖睡鸳鸯”描绘了怎样的画面？","type":"short","keywords":["燕子","鸳鸯","春","泥融","沙暖"],"answer":"春天到来，泥土变得松软，燕子飞来衔泥，温暖的沙滩上鸳鸯悠闲地休息。"},{"q":"《三衢道中》中“绿阴不减来时路”的意思是什么？","type":"short","keywords":["绿阴","树荫","浓绿","来时"],"answer":"回去时路旁的树木依然浓绿，树荫并没有比来时减少。"},{"q":"请写出《惠崇春江晚景》中描写桃花和春水的相关诗句。","type":"fill","keywords":["竹外桃花三两枝","春江水暖鸭先知"],"answer":"竹外桃花三两枝，春江水暖鸭先知。"},{"q":"学习这三首古诗时，你能从诗中发现哪些春天的景物？至少写出三种。","type":"short","keywords":["燕子","桃花","鸭","芦芽","梅子","绿阴"],"answer":"燕子、桃花、鸭子、芦芽、梅子、绿阴等。"}]},
{"title":"2 燕子","questions":[{"q":"课文中的燕子给人的总体印象是？","opts":["活泼可爱","凶猛可怕","安静笨重","孤独悲伤"],"a":0,"type":"choice"},{"q":"燕子的羽毛主要被描写成什么颜色？","opts":["乌黑","雪白","金黄","碧绿"],"a":0,"type":"choice"},{"q":"燕子的尾巴有什么特点？","opts":["剪刀似的","扇子似的","月牙似的","圆盘似的"],"a":0,"type":"choice"},{"q":"春天到来后，燕子加入了怎样的画面？","opts":["春光中的生动画面","冬日雪景","秋日落叶","夜晚城市"],"a":0,"type":"choice"},{"q":"“赶集似的聚拢来”主要运用了什么写法？","opts":["比喻","夸张","拟人","反问"],"a":2,"type":"choice"},{"q":"文中燕子飞行时的动作给人的感觉是？","opts":["轻快灵活","缓慢沉重","笨拙迟钝","害怕躲藏"],"a":0,"type":"choice"},{"q":"燕子停在电线上，远看像什么？","opts":["五线谱上的音符","一串葡萄","一排花朵","一条小鱼"],"a":0,"type":"choice"},{"q":"学习《燕子》最应该抓住的关键词是？","opts":["春天、燕子、轻快、活泼","冬天、雪花、寒冷","秋天、落叶、寂静","夏天、雷雨、炎热"],"a":0,"type":"choice"},{"q":"请用自己的话描写燕子飞行时的特点。","type":"short","keywords":["轻快","灵活","迅速","斜飞","掠过"],"answer":"燕子飞行轻快、灵活，有时斜飞，有时横掠水面，动作十分敏捷。"},{"q":"为什么作者说燕子“为春光平添了许多生趣”？","type":"short","keywords":["燕子","春光","生趣","活泼"],"answer":"燕子活泼轻快地飞翔、停歇，使原本美丽的春光更加生动有趣。"},{"q":"请写出课文中描写燕子停在电线上的比喻句。","type":"fill","keywords":["五线谱","音符"],"answer":"几对燕子飞倦了，落在电线上。蓝蓝的天空，电杆之间连着几痕细线，多么像五线谱啊！"},{"q":"从《燕子》中，你能体会到作者怎样的思想感情？","type":"short","keywords":["喜爱","赞美","春天","燕子"],"answer":"作者通过对燕子和春天景色的描写，表达了对燕子的喜爱和对春天的赞美。"}]},
{"title":"3 荷花","questions":[{"q":"作者是怎样来到荷花池边的？","opts":["跑过去的","闻到清香后赶到的","被别人拉去的","坐船过去的"],"a":1,"type":"choice"},{"q":"“白荷花在这些大圆盘之间冒出来”中的“冒”字表现了荷花怎样的特点？","opts":["生命力旺盛","非常害怕","动作缓慢","即将凋谢"],"a":0,"type":"choice"},{"q":"荷花有哪些姿态？","opts":["全展开、半展开、花骨朵","只有完全开放","只有花骨朵","全部凋谢"],"a":0,"type":"choice"},{"q":"作者把自己想象成了什么？","opts":["一朵荷花","一只蜻蜓","一片荷叶","一只蝴蝶"],"a":0,"type":"choice"},{"q":"荷花池中的荷叶有什么特点？","opts":["挨挨挤挤、碧绿","稀稀拉拉、枯黄","全部漂浮","非常矮小"],"a":0,"type":"choice"},{"q":"“翩翩起舞”表现了什么？","opts":["轻盈优美的舞姿","非常生气","快速逃跑","安静睡觉"],"a":0,"type":"choice"},{"q":"如果你也是一朵荷花，可能会看到哪些景物？","opts":["小鱼、蜻蜓、荷叶等","高楼、汽车","雪山、冰川","沙漠、骆驼"],"a":0,"type":"choice"},{"q":"《荷花》主要表达了作者什么感情？","opts":["对荷花的喜爱和赞美","对秋天的厌恶","对城市生活的向往","对动物的害怕"],"a":0,"type":"choice"},{"q":"请写出三个描写荷花姿态的词语。","type":"fill","keywords":["全展开","花骨朵","展开","半开"],"answer":"有的才展开两三片花瓣儿，有的花瓣儿全展开了，露出嫩黄色的小莲蓬，有的还是花骨朵。"},{"q":"为什么“我”觉得自己仿佛就是一朵荷花？","type":"short","keywords":["想象","荷花","入迷","沉浸"],"answer":"因为作者被美丽的荷花深深吸引，观察时产生了丰富的想象，仿佛自己也成了一朵荷花。"},{"q":"请写出你印象最深的一个荷花特点，并说明理由。","type":"short","keywords":["美","清香","姿态","碧绿","洁白"],"answer":"示例：荷花姿态优美，有的盛开，有的半开，有的还是花骨朵，让我感到非常美丽。"},{"q":"如果删去课文最后的想象部分，只保留前面的荷花描写，文章会有什么变化？","type":"short","keywords":["想象","生动","趣味","感染力"],"answer":"文章会少了想象和趣味，也不能充分表现作者沉浸在荷花美景中的感受。"}]},
{"title":"4 昆虫备忘录","questions":[{"q":"《昆虫备忘录》主要介绍了哪几种昆虫？","opts":["蜻蜓、瓢虫、独角仙、蚂蚱","蜜蜂、蚂蚁、蝴蝶、蜘蛛","青蛙、蝉、燕子、蜻蜓","鱼、虾、蟹、龟"],"a":0,"type":"choice"},{"q":"复眼的特点是什么？","opts":["由许多小眼睛组成","只有一只眼睛","没有眼睛","眼睛很大但不能动"],"a":0,"type":"choice"},{"q":"“花大姐”指的是哪种昆虫？","opts":["瓢虫","蝴蝶","蜜蜂","蚂蚁"],"a":0,"type":"choice"},{"q":"独角仙最突出的特点是什么？","opts":["头部有一只角","身体透明","会发光","没有翅膀"],"a":0,"type":"choice"},{"q":"作者为什么觉得蚂蚱很有趣？","opts":["颜色、形态和动作有趣","因为蚂蚱很大","因为蚂蚱会唱歌","因为蚂蚱不会动"],"a":0,"type":"choice"},{"q":"这篇课文的语言特点是什么？","opts":["生动有趣、富有童趣","非常严肃枯燥","全部是数学公式","全部是新闻语言"],"a":0,"type":"choice"},{"q":"学习昆虫时，作者主要采用了什么方法？","opts":["观察、记录和介绍","只凭想象","完全不观察","只抄课本"],"a":0,"type":"choice"},{"q":"“备忘录”在本文中可以理解为？","opts":["记录昆虫特点的资料","一本小说","一封信","一张地图"],"a":0,"type":"choice"},{"q":"为什么说《昆虫备忘录》不像传统说明文那样枯燥？","type":"short","keywords":["有趣","观察","语言","童趣","生动"],"answer":"作者用轻松、生动、有趣的语言介绍昆虫，还加入自己的观察和感受，所以读起来很有趣。"},{"q":"如果让你制作一份昆虫备忘录，你会记录哪些内容？至少写三项。","type":"short","keywords":["外形","颜色","习性","食物","生活环境"],"answer":"可以记录昆虫的外形、颜色、生活习性、食物和生活环境等。"},{"q":"请写出你最感兴趣的一种昆虫，并说明它的一个特点。","type":"short","keywords":["蜻蜓","瓢虫","独角仙","蚂蚱"],"answer":"示例：我最感兴趣的是独角仙，因为它的头部有一只特别醒目的角。"},{"q":"从这篇课文中，你认为观察事物时应该注意什么？","type":"short","keywords":["仔细观察","特点","记录","比较"],"answer":"观察事物要仔细，抓住特点，可以进行比较，并把观察到的内容及时记录下来。"}]},
{"title":"第二单元 · 5 守株待兔","questions":[{"q":"农夫为什么每天守在树桩旁？","opts":["因为兔子撞死在树桩上","因为那里有粮食","因为喜欢树桩","因为要砍树"],"a":0,"type":"choice"},{"q":"农夫捡到兔子后产生了怎样的想法？","opts":["希望每天都能捡到兔子","以后努力种田","马上离开","把兔子放生"],"a":0,"type":"choice"},{"q":"农夫最后的田地怎么样了？","opts":["荒废了","大丰收","种满鲜花","变成池塘"],"a":0,"type":"choice"},{"q":"“因释其耒而守株”中的“释”是什么意思？","opts":["放下","拿起","丢失","修理"],"a":0,"type":"choice"},{"q":"这个故事告诉我们什么道理？","opts":["不能把偶然发生的事情当成必然","只要等待就能成功","种田没有用","运气比努力重要"],"a":0,"type":"choice"},{"q":"农夫为什么可笑？","opts":["不再劳动，只想靠运气获得收获","太勤劳","帮助了别人","认真学习"],"a":0,"type":"choice"},{"q":"“兔走触株”中的“走”是什么意思？","opts":["跑","行走","离开","逃跑"],"a":0,"type":"choice"},{"q":"这则寓言主要采用了什么表达方式？","opts":["通过故事说明道理","介绍科学知识","写景抒情","新闻报道"],"a":0,"type":"choice"},{"q":"请用自己的话解释“守株待兔”的意思。","type":"short","keywords":["偶然","侥幸","等待","不劳而获"],"answer":"比喻不主动努力，而是抱着侥幸心理，希望得到意外的收获。"},{"q":"如果你是农夫，在兔子撞死以后，你会怎么做？为什么？","type":"short","keywords":["继续劳动","种田","努力","不能等待"],"answer":"我会继续认真种田，因为兔子撞树只是偶然事件，不能靠运气生活。"},{"q":"这篇寓言中的农夫犯了什么错误？","type":"short","keywords":["侥幸","懒惰","不劳而获","偶然"],"answer":"他把偶然发生的事情当成必然，放弃劳动，妄想靠运气获得更多收获。"},{"q":"生活中有哪些“守株待兔”式的想法？请举一个例子。","type":"short","keywords":["等待","运气","努力","侥幸"],"answer":"例如学习时不认真复习，只想着考试时碰到自己会做的题目，这就是抱着侥幸心理。"}]},

{"title":"第二单元 · 8 池子与河流","questions":[{"q":"池子最大的愿望是什么？","opts":["过安逸、平静的生活","不停地奔跑","帮助别人","成为大海"],"a":0,"type":"choice"},{"q":"河流对池子的生活态度怎么看？","opts":["认为应该积极进取","认为非常羡慕","认为完全正确","没有任何看法"],"a":0,"type":"choice"},{"q":"河流最大的特点是什么？","opts":["不断流动、积极向前","永远停滞","害怕困难","只想休息"],"a":0,"type":"choice"},{"q":"池子最后的结局是什么？","opts":["干涸","流入大海","变成河流","越来越清澈"],"a":0,"type":"choice"},{"q":"河流最后的生活怎样？","opts":["不断前进，为人们提供帮助","越来越懒惰","变成池塘","完全消失"],"a":0,"type":"choice"},{"q":"这首寓言诗告诉我们什么道理？","opts":["只有不断进取，才能创造价值","休息永远最好","只要舒服就能成功","河流一定比池子好看"],"a":0,"type":"choice"},{"q":"池子的错误观念是什么？","opts":["把安逸当作幸福，不愿付出","认为劳动很重要","喜欢帮助别人","坚持不断前进"],"a":0,"type":"choice"},{"q":"“才能不利用才会衰退”说明了什么？","opts":["能力需要在使用中保持和发展","能力越用越少","不需要学习","休息能让能力自动增长"],"a":0,"type":"choice"},{"q":"池子为什么会一步步走向干涸？","type":"short","keywords":["安逸","不流动","停止","懒惰","干涸"],"answer":"池子安于现状，不愿流动和付出，失去了生命力，最后走向干涸。"},{"q":"河流为什么能够一直保持活力？","type":"short","keywords":["流动","前进","劳动","奉献","不断"],"answer":"河流不断流动、不断前进，并通过劳动和奉献创造价值，所以一直保持活力。"},{"q":"这篇寓言诗中的“池子”和“河流”分别象征怎样的人？","type":"short","keywords":["安逸","进取","懒惰","奉献"],"answer":"池子象征贪图安逸、不思进取的人；河流象征积极进取、愿意劳动和奉献的人。"},{"q":"结合学习生活，说说“才能不利用才会衰退”对你有什么启发。","type":"short","keywords":["练习","学习","坚持","能力","使用"],"answer":"学习到的知识和能力需要经常练习和使用，不能因为暂时会了就停止学习。"}]},

{"title":"第三单元 · 10 纸的发明","questions":[{"q":"早期人们曾经把什么作为书写材料？","opts":["龟甲、兽骨、竹片、木片等","玻璃","塑料","橡胶"],"a":0,"type":"choice"},{"q":"蔡伦改进造纸术是在什么时候？","opts":["东汉","唐朝","宋朝","明朝"],"a":0,"type":"choice"},{"q":"蔡伦改进造纸术时主要使用了什么材料？","opts":["树皮、麻头、破布、旧渔网等","黄金","玻璃","丝绸"],"a":0,"type":"choice"},{"q":"纸的发明对世界文明有什么影响？","opts":["促进了文化传播和文明发展","使人们不能读书","只方便写字","没有影响"],"a":0,"type":"choice"},{"q":"造纸术传到世界各地后，人们的生活发生了什么变化？","opts":["知识传播更加方便","书籍越来越少","文化交流停止","文字消失"],"a":0,"type":"choice"},{"q":"为什么说造纸术是中国对世界文明的伟大贡献之一？","opts":["方便了文化记录和传播","因为纸很漂亮","因为纸只能中国使用","因为纸不能保存"],"a":0,"type":"choice"},{"q":"课文主要采用什么方式介绍纸的发明？","opts":["按照历史发展顺序","按照颜色","按照人物年龄","按照天气变化"],"a":0,"type":"choice"},{"q":"从课文中可以看出古代劳动人民怎样的品质？","opts":["智慧、勤劳、不断改进","懒惰","害怕尝试","不愿创新"],"a":0,"type":"choice"},{"q":"为什么造纸术的改进比单纯发明一种材料更重要？","type":"short","keywords":["成本","方便","普及","文化传播"],"answer":"改进后的造纸术让纸张更便宜、更方便制作，也更容易普及，从而促进了文化传播。"},{"q":"请按照课文内容简要说说纸是怎样一步步发展起来的。","type":"short","keywords":["龟甲","竹片","帛","蔡伦","造纸术"],"answer":"人们先用龟甲、兽骨等书写，后来使用竹片、木片和帛等材料，蔡伦在前人的基础上改进造纸术，使纸更便宜实用。"},{"q":"纸的发明为什么会改变人类文明？","type":"short","keywords":["记录","传播","知识","文化","文明"],"answer":"纸让文字和知识更容易记录、保存和传播，使文化能够更广泛地传承。"},{"q":"作为现代学生，你应该怎样看待古人的发明创造？","type":"short","keywords":["尊重","学习","创新","传承"],"answer":"应该尊重古人的智慧，学习他们善于观察和创新的精神，并努力传承和发展科技。"}]},

const KEY='grade3PaperTextV1';let state=loadState(),li=0,submitted=false;
function loadState(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&typeof x==='object')return x}catch(e){}return {stars:0,finished:{},mistakes:[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderStats()}
function $(id){return document.getElementById(id)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function titleName(l){return l.title.split(' · ').slice(1).join(' · ')||l.title}
function renderStats(){$('stars').textContent=state.stars;$('finished').textContent=Object.keys(state.finished).length;$('mistakeNum').textContent=state.mistakes.length;$('lessonCount').textContent=lessons.length+'张'}
function renderHome(){renderStats();let g=$('lessonGrid');g.innerHTML='';lessons.forEach((l,i)=>{let b=document.createElement('button');b.className='lesson';let best=state.finished[i]?.best;b.innerHTML='<span class="unit">'+esc(l.title.split(' · ')[0])+'</span>'+esc(titleName(l))+(best!=null?'　🏆':'');b.onclick=()=>start(i);g.appendChild(b)})}
function hideAll(){['home','paper','result','mistakes'].forEach(id=>$(id).classList.add('hidden'))}
function goHome(){hideAll();$('home').classList.remove('hidden');renderHome();scrollTo(0,0)}
function start(i){li=i;submitted=false;hideAll();$('paper').classList.remove('hidden');$('paperTitle').textContent=titleName(lessons[li]);$('paperBadge').textContent='第'+(li+1)+'张';$('paperInfo').textContent='共 '+lessons[li].questions.length+' 题 · 所有题目均需自己输入答案';renderPaper();scrollTo(0,0)}
function renderPaper(){let box=$('paperQuestions');box.innerHTML='';let qs=lessons[li].questions;qs.forEach((q,i)=>{let d=document.createElement('div');d.className='questionCard';let short=q.type==='short';d.innerHTML='<div class="qno">第 '+(i+1)+' 题</div><div class="qtext">'+esc(q.q)+'</div><div class="hint">'+(short?'请用完整句子回答：':'请直接写出你的答案：')+'</div>'+(short?'<textarea class="answer short" data-i="'+i+'" placeholder="请写完整答案，不要只写几个字"></textarea>':'<input class="answer" data-i="'+i+'" autocomplete="off" placeholder="请输入答案">');box.appendChild(d)});updateProgress()}
function normalize(s){return String(s||'').toLowerCase().replace(/[\s\u3000，。！？；：、“”‘’（）()《》【】\[\]、,.!?;:"']/g,'')}
function accepted(q){if(q.type==='choice')return[q.opts[q.a]];if(q.type==='tf')return[q.answer?'正确':'错误'];if(q.type==='sort')return[q.items[q.answer]];if(q.answer)return[q.answer];return q.keywords||[]}
function check(q,user){let u=normalize(user);if(!u)return false;let arr=accepted(q).map(normalize).filter(Boolean);if(!arr.length)return u.length>=2;if(q.type==='short'){let keys=(q.keywords||[]).map(normalize).filter(Boolean);return keys.length?keys.some(k=>u.includes(k)):u.length>=6}return arr.some(a=>u===a||u.includes(a)||a.includes(u))}
function updateProgress(){let inputs=[...document.querySelectorAll('.answer')];let n=inputs.filter(x=>x.value.trim()).length;let total=inputs.length;$('filledInfo').textContent='已填写 '+n+' / '+total+' 题'+(n===total?' · 可以交卷了':' · 还有题目没有完成');$('bar').style.width=(n/total*100)+'%'}
function clearAnswers(){document.querySelectorAll('.answer').forEach(x=>{x.value='';x.classList.remove('correct','wrong')});$('filledInfo').textContent='请认真完成全部题目后再交卷';$('bar').style.width='0%'}
document.addEventListener('input',e=>{if(e.target.classList.contains('answer'))updateProgress()});
function submitPaper(){if(submitted)return;let qs=lessons[li].questions,inputs=[...document.querySelectorAll('.answer')],empty=inputs.filter(x=>!x.value.trim());if(empty.length){alert('还有 '+empty.length+' 题没有填写，请完成后再提交。');empty[0].focus();return}let score=0,review='';state.mistakes=state.mistakes||[];qs.forEach((q,i)=>{let user=inputs[i].value.trim(),ok=check(q,user);inputs[i].classList.add(ok?'correct':'wrong');if(ok){score++;state.stars+=2}else{state.mistakes.unshift({lesson:lessons[li].title,q:q.q,user:user,answer:getAnswerText(q),time:new Date().toLocaleString()})}review+='<div class="questionCard"><b>第 '+(i+1)+' 题：'+(ok?'✅ 正确':'❌ 需要订正')+'</b>'+(ok?'':'<div class="reviewAnswer">参考答案：'+esc(getAnswerText(q))+(q.explain?'<br>'+esc(q.explain):'')+'</div>')+'</div>'});state.mistakes=state.mistakes.slice(0,200);let total=qs.length,old=state.finished[li]?.best||0;state.finished[li]={best:Math.max(old,score),stars:Math.max(state.finished[li]?.stars||0,score)};save();submitted=true;hideAll();$('result').classList.remove('hidden');let pct=score/total;$('resultTitle').textContent=pct>=.9?'🏆 优秀！':pct>=.75?'🎉 很棒！':pct>=.6?'👏 达标了，再巩固一下':'🌱 再认真读一遍课文';let n=Math.max(1,Math.round(pct*5));$('resultStars').textContent='⭐'.repeat(n)+'☆'.repeat(5-n);$('resultText').textContent='《'+titleName(lessons[li])+'》：共 '+total+' 题，答对 '+score+' 题。红色题目要回到课文重新订正。';$('resultReview').innerHTML='<div class="section"><h3>📝 本次订正</h3>'+review+'</div>';scrollTo(0,0)}
function getAnswerText(q){if(q.type==='choice')return q.opts[q.a];if(q.type==='tf')return q.answer?'正确':'错误';if(q.type==='sort')return q.items[q.answer];return q.answer||(q.keywords||[]).join('、')||'请结合课文完整作答'}
function replay(){start(li)}
function showMistakes(){hideAll();$('mistakes').classList.remove('hidden');let list=state.mistakes||[];$('mistakeSummary').textContent='共 '+list.length+' 道错题。建议订正后再回到对应课文重新作答。';let box=$('mistakeList');box.innerHTML='';if(!list.length){box.innerHTML='<div class="feedback ok">🎉 暂时没有错题，继续保持！</div>';return}list.forEach((m,i)=>{let d=document.createElement('div');d.className='mistake';d.innerHTML='<b>'+ (i+1)+'．'+esc(m.lesson)+'</b><br>'+esc(m.q)+'<br>我的答案：'+esc(m.user)+'<br><strong>参考答案：'+esc(m.answer)+'</strong><br><span class="small">'+esc(m.time)+'</span>';box.appendChild(d)})}
function resetAll(){if(confirm('确定清除全部学习记录、星星和错题吗？')){localStorage.removeItem(KEY);state=loadState();goHome()}}
renderHome();
</script></body></html>
