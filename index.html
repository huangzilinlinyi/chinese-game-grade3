<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>三年级下册语文高难度闯关</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#222}
button{font-family:inherit;cursor:pointer}
.app{max-width:760px;margin:auto;min-height:100vh;padding:12px}
.header{background:linear-gradient(135deg,#5b5ce2,#7778f5);color:white;border-radius:22px;padding:24px 20px;margin-bottom:12px;box-shadow:0 8px 25px #5552}
.header h1{margin:0;font-size:25px}
.header p{margin:8px 0 0;opacity:.9}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{background:white;border-radius:15px;padding:12px;text-align:center;flex:1;box-shadow:0 3px 12px #0000000a}
.stat b{display:block;font-size:21px}
.stat span{font-size:12px;color:#777}
.card{background:white;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 3px 15px #0000000a}
.namebox{display:flex;gap:8px}
input{flex:1;border:2px solid #eee;border-radius:12px;padding:12px;font-size:16px;outline:none}
.mainbtn{border:0;background:#5b5ce2;color:white;border-radius:12px;padding:12px 18px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lesson{border:2px solid #eee;background:white;border-radius:16px;padding:15px;text-align:left;min-height:76px;font-size:15px;font-weight:700}
.lesson small{display:block;color:#888;margin-bottom:5px}
.lesson.done{border-color:#5b5ce2;background:#f1f1ff}
.lesson.locked{opacity:.45}
.top{display:flex;align-items:center;gap:8px}
.back{border:0;background:#eeeefb;color:#5555c8;border-radius:10px;padding:9px 13px;font-weight:700}
.title{font-weight:800;font-size:18px;flex:1}
.progress{height:9px;background:#eee;border-radius:20px;overflow:hidden;margin:15px 0}
.bar{height:100%;width:0;background:#5b5ce2;transition:.3s}
.qmeta{font-size:13px;color:#888}
.question{font-size:20px;font-weight:800;line-height:1.6;margin:12px 0 18px}
.context{background:#fafafa;border-left:4px solid #7778f5;padding:12px;border-radius:8px;line-height:1.7;margin-bottom:15px;font-size:15px}
.option{width:100%;display:block;text-align:left;background:white;border:2px solid #e8e8ee;border-radius:14px;padding:14px;margin:10px 0;font-size:16px;line-height:1.5}
.option:hover{border-color:#7778f5}
.option.correct{border-color:#25a96b;background:#edfff6}
.option.wrong{border-color:#ef6262;background:#fff1f1}
.option.disabled{pointer-events:none}
.feedback{min-height:28px;font-weight:700;line-height:1.5}
.next{width:100%;border:0;background:#5b5ce2;color:white;padding:14px;border-radius:14px;font-size:17px;font-weight:800}
.hidden{display:none!important}
.result{text-align:center}
.big{font-size:32px;font-weight:900}
.stars{font-size:35px;margin:12px}
.mistake{padding:12px;background:#fff7f7;border-radius:12px;margin:8px 0}
.mistake b{display:block;margin-bottom:5px}
.tab{display:flex;gap:8px;margin-bottom:12px}
.tab button{flex:1;border:0;border-radius:10px;padding:10px;background:#eee}
.tab button.active{background:#5b5ce2;color:white}
@media(max-width:520px){
 .grid{grid-template-columns:1fr}
 .question{font-size:18px}
 .header h1{font-size:22px}
}
</style>
</head>

<body>
<div class="app">

<div id="home">
  <div class="header">
    <h1>📚 语文高难度闯关</h1>
    <p>三年级下册 · 一课一关 · 认真读题才能过关</p>
  </div>

  <div class="stats">
    <div class="stat"><b id="stars">0</b><span>⭐ 星星</span></div>
    <div class="stat"><b id="coins">0</b><span>🪙 积分</span></div>
    <div class="stat"><b id="finished">0</b><span>完成课文</span></div>
    <div class="stat"><b id="mistakeNum">0</b><span>错题</span></div>
  </div>

  <div class="card">
    <div class="namebox">
      <input id="childName" placeholder="请输入孩子的名字">
      <button class="mainbtn" onclick="saveName()">保存</button>
    </div>
  </div>

  <div class="tab">
    <button class="active" onclick="showLessons()">📖 课文闯关</button>
    <button onclick="showMistakes()">❌ 错题本</button>
  </div>

  <div id="lessonPage">
    <div class="card">
      <b>闯关规则</b>
      <p style="color:#666;line-height:1.6;margin-bottom:0">
        每篇课文独立一关。全部采用选择题，但选项会故意设置相近干扰项，
        重点考查生字、词语、课文细节、句子理解、人物特点和中心思想。
      </p>
    </div>
    <div id="lessonGrid" class="grid"></div>
  </div>

  <div id="mistakePage" class="hidden">
    <div class="card">
      <h3>❌ 我的错题本</h3>
      <div id="mistakeList"></div>
    </div>
  </div>
</div>

<div id="game" class="hidden">
  <div class="card">
    <div class="top">
      <button class="back" onclick="goHome()">← 返回</button>
      <div class="title" id="lessonTitle"></div>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="qmeta" id="qmeta"></div>
  </div>

  <div class="card">
    <div id="context" class="context hidden"></div>
    <div id="question" class="question"></div>
    <div id="answerArea"></div>
    <div id="feedback" class="feedback"></div>
    <button id="nextBtn" class="next hidden" onclick="nextQuestion()">下一题 →</button>
  </div>
</div>

<div id="result" class="hidden">
  <div class="card result">
    <div class="big" id="resultTitle"></div>
    <div class="stars" id="resultStars"></div>
    <h2 id="resultScore"></h2>
    <p id="resultText" style="color:#777;line-height:1.7"></p>
    <button class="mainbtn" onclick="goHome()">返回课文列表</button>
  </div>
</div>

</div>

/* ================= 程序 ================= */

const KEY="grade3HighDifficultyV3";

let state=loadState();
let currentLesson=0;
let currentQuestion=0;
let score=0;
let answered=false;

function loadState(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    if(x)return x;
  }catch(e){}
  return {
    name:"",
    stars:0,
    coins:0,
    finished:{},
    mistakes:[]
  };
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
  updateStats();
}

function updateStats(){
  document.getElementById("stars").textContent=state.stars;
  document.getElementById("coins").textContent=state.coins;
  document.getElementById("finished").textContent=Object.keys(state.finished).length;
  document.getElementById("mistakeNum").textContent=state.mistakes.length;
  document.getElementById("childName").value=state.name||"";
}

function saveName(){
  state.name=document.getElementById("childName").value.trim();
  save();
}

function renderLessons(){
  const box=document.getElementById("lessonGrid");
  box.innerHTML="";

  lessons.forEach((lesson,i)=>{
    const done=state.finished[i];
    const unlocked=i===0 || state.finished[i-1];

    const btn=document.createElement("button");
    btn.className="lesson "+(done?"done ":"")+(unlocked?"":"locked");

    btn.innerHTML=
      "<small>"+(done?"🏆 已完成":"第 "+(i+1)+" 关")+"</small>"+
      lesson.title.replace(/^第\d+课 · /,"")+
      (unlocked?"":" 🔒");

    btn.onclick=()=>{
      if(unlocked)startLesson(i);
    };

    box.appendChild(btn);
  });
}

function showLessons(){
  document.getElementById("lessonPage").classList.remove("hidden");
  document.getElementById("mistakePage").classList.add("hidden");
  document.querySelectorAll(".tab button")[0].classList.add("active");
  document.querySelectorAll(".tab button")[1].classList.remove("active");
  renderLessons();
}

function showMistakes(){
  document.getElementById("lessonPage").classList.add("hidden");
  document.getElementById("mistakePage").classList.remove("hidden");

  document.querySelectorAll(".tab button")[0].classList.remove("active");
  document.querySelectorAll(".tab button")[1].classList.add("active");

  const box=document.getElementById("mistakeList");

  if(!state.mistakes.length){
    box.innerHTML="<p style='color:#888'>目前还没有错题，继续加油！⭐</p>";
    return;
  }

  box.innerHTML=state.mistakes.map((m,i)=>`
    <div class="mistake">
      <b>${i+1}. ${escapeHtml(m.lesson)}</b>
      <div>${escapeHtml(m.q)}</div>
      <div style="color:#25a96b;margin-top:6px">
        正确答案：${escapeHtml(m.answer)}
      </div>
    </div>
  `).join("");
}

function startLesson(i){
  currentLesson=i;
  currentQuestion=0;
  score=0;
  answered=false;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  document.getElementById("lessonTitle").textContent=lessons[i].title;

  showQuestion();

  window.scrollTo(0,0);
}

function showQuestion(){
  const lesson=lessons[currentLesson];
  const data=lesson.qs[currentQuestion];

  answered=false;

  const total=lesson.qs.length;

  document.getElementById("qmeta").textContent=
    "第 "+(currentQuestion+1)+" / "+total+" 题　｜　本关得分："+score;

  document.getElementById("bar").style.width=
    ((currentQuestion+1)/total*100)+"%";

  document.getElementById("question").textContent=data[0];

  const area=document.getElementById("answerArea");
  area.innerHTML="";

  document.getElementById("feedback").innerHTML="";

  document.getElementById("nextBtn").classList.add("hidden");

  const opts=data[1];
  const correct=data[2];

  /*
   * 选项显示顺序随机。
   * 但正确答案索引同步调整，
   * 防止孩子记住固定位置。
   */
  const arr=opts.map((text,index)=>({
    text,
    original:index
  }));

  arr.sort(()=>Math.random()-.5);

  arr.forEach(item=>{
    const b=document.createElement("button");
    b.className="option";
    b.textContent=item.text;

    b.onclick=()=>{
      checkAnswer(b,item.original===correct,data);
    };

    area.appendChild(b);
  });
}

function checkAnswer(btn,isCorrect,data){
  if(answered)return;

  answered=true;

  const options=document.querySelectorAll(".option");
  options.forEach(x=>x.classList.add("disabled"));

  const correctText=data[1][data[2]];

  if(isCorrect){

    btn.classList.add("correct");

    score+=10;
    state.stars+=1;
    state.coins+=10;

    document.getElementById("feedback").innerHTML=
      "✅ 回答正确！+10分 ⭐";

  }else{

    btn.classList.add("wrong");

    options.forEach(o=>{
      if(o.textContent===correctText){
        o.classList.add("correct");
      }
    });

    document.getElementById("feedback").innerHTML=
      "❌ 答错了。正确答案是：<b>"+escapeHtml(correctText)+"</b>";

    addMistake(
      lessons[currentLesson].title,
      data[0],
      correctText
    );
  }

  save();

  document.getElementById("nextBtn").classList.remove("hidden");
}

function addMistake(lesson,q,answer){

  /*
   * 同一课同一道题只保存一次，
   * 避免错题本重复。
   */

  const exists=state.mistakes.some(
    m=>m.lesson===lesson && m.q===q
  );

  if(!exists){
    state.mistakes.push({
      lesson,
      q,
      answer
    });
  }
}

function nextQuestion(){

  const total=lessons[currentLesson].qs.length;

  if(currentQuestion<total-1){
    currentQuestion++;
    showQuestion();
    window.scrollTo(0,0);
  }else{
    finishLesson();
  }
}

function finishLesson(){

  const total=lessons[currentLesson].qs.length;

  const percent=Math.round(score/(total*10)*100);

  const old=state.finished[currentLesson];

  if(!old || score>old.best){
    state.finished[currentLesson]={
      best:score,
      percent
    };
  }

  save();

  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  let stars="";

  if(percent>=90){
    stars="⭐⭐⭐⭐⭐";
  }else if(percent>=75){
    stars="⭐⭐⭐⭐";
  }else if(percent>=60){
    stars="⭐⭐⭐";
  }else if(percent>=40){
    stars="⭐⭐";
  }else{
    stars="⭐";
  }

  document.getElementById("resultTitle").textContent=
    percent>=60?"🎉 闯关成功！":"💪 再认真复习一次！";

  document.getElementById("resultStars").textContent=stars;

  document.getElementById("resultScore").textContent=
    score+" / "+(total*10)+" 分";

  document.getElementById("resultText").innerHTML=
    "本关正确率："+percent+"%<br>"+
    (percent>=90
      ?"太棒了！这套题难度比较高，你的基础非常扎实。"
      :percent>=60
      ?"不错！把错题再复习一下，下次争取更高分。"
      :"别着急，这些题目故意提高了难度，把错题重新看一遍就会进步。");
}

function goHome(){
  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");

  updateStats();
  renderLessons();

  window.scrollTo(0,0);
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

updateStats();
renderLessons();
</script>

</body>
</html>
