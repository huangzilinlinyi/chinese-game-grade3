<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>三年级语文大冒险·高难度版</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#fff8e8,#eaf7ff);
  color:#263238;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:820px;margin:auto;min-height:100vh;padding:14px}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}
.brand{font-size:21px;font-weight:900}
.stats{display:flex;gap:5px}
.pill{
  background:#fff;
  border-radius:99px;
  padding:7px 10px;
  box-shadow:0 3px 12px #0001;
  font-size:13px;
  white-space:nowrap;
}

.hero,.panel,.card{
  background:#fff;
  border-radius:22px;
  padding:18px;
  box-shadow:0 7px 25px #00000012;
}
.hero{margin-bottom:14px}
.hero h1{margin:0 0 8px;font-size:28px}
.hero p{color:#607d8b;line-height:1.7}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:10px 0;
}
.toolbar input{
  flex:1;
  min-width:180px;
  padding:11px;
  border:1px solid #dce5ea;
  border-radius:12px;
  outline:none;
}
.primary,.secondary{
  border:0;
  border-radius:13px;
  padding:11px 15px;
  font-weight:800;
}
.primary{background:#ff9f43;color:white}
.secondary{background:#eef3f7;color:#455a64}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
}
.card{
  min-height:175px;
  padding:15px;
}
.card h3{margin:0 0 6px}
.card p{font-size:13px;color:#78909c;line-height:1.5}
.badge{float:right;font-size:27px}

.stars{
  color:#ffb300;
  font-weight:800;
  margin:9px 0;
}
.progress{
  height:9px;
  background:#e8eef2;
  border-radius:99px;
  overflow:hidden;
}
.progress i{
  display:block;
  height:100%;
  background:#66bb6a;
  transition:.3s;
}

.hidden{display:none!important}
.center{text-align:center}

.stage{
  display:flex;
  gap:6px;
  overflow-x:auto;
  margin-bottom:10px;
}
.stage span{
  background:#eef3f7;
  padding:7px 10px;
  border-radius:99px;
  font-size:12px;
  white-space:nowrap;
}
.stage .active{
  background:#ff9f43;
  color:#fff;
  font-weight:bold;
}

.question{
  font-size:20px;
  font-weight:800;
  line-height:1.65;
  margin:15px 0;
}

.article{
  background:#f8fafb;
  border-left:4px solid #90caf9;
  padding:14px;
  border-radius:10px;
  line-height:1.9;
  margin-bottom:15px;
}

.options{
  display:grid;
  gap:10px;
}
.option{
  width:100%;
  padding:14px;
  border:2px solid transparent;
  border-radius:14px;
  background:#f5f8fa;
  text-align:left;
  transition:.15s;
}
.option:hover{
  background:#edf5f9;
}
.option.correct{
  border-color:#66bb6a;
  background:#effaf0;
}
.option.wrong{
  border-color:#ef5350;
  background:#fff0ef;
}

.answer-input{
  width:100%;
  padding:13px;
  border:2px solid #dce5ea;
  border-radius:13px;
  outline:none;
  resize:vertical;
  min-height:50px;
}
.answer-input:focus{border-color:#90caf9}

.feedback{
  margin:12px 0;
  padding:13px;
  border-radius:12px;
  line-height:1.6;
}
.ok{background:#edf8ef;color:#2e7d32}
.bad{background:#fff0ef;color:#c62828}

.type-tag{
  display:inline-block;
  padding:5px 9px;
  border-radius:8px;
  background:#fff3e0;
  color:#e65100;
  font-size:12px;
  font-weight:bold;
}

.mistake{
  margin:9px 0;
  padding:12px;
  border-left:5px solid #ff9f43;
  background:#fafafa;
  border-radius:9px;
  line-height:1.7;
}

.locked{
  opacity:.55;
  filter:grayscale(.4);
}

.small{
  font-size:12px;
  color:#78909c;
}

.section-title{
  margin-top:22px;
  margin-bottom:10px;
}

@media(max-width:560px){
  .grid{grid-template-columns:1fr}
  .hero h1{font-size:24px}
  .question{font-size:18px}
  .brand{font-size:18px}
  .pill{font-size:12px;padding:6px 8px}
}
</style>
</head>

<body>

<div class="app">

<div class="top">
  <div class="brand">📚 三年级语文大冒险</div>
  <div class="stats">
    <span class="pill">⭐ <b id="stars">0</b></span>
    <span class="pill">🪙 <b id="coins">0</b></span>
  </div>
</div>

<!-- 首页 -->
<section id="home">

<div class="hero">
  <h1>🏆 三年级语文高难度挑战</h1>

  <p>
    每篇课文独立闯关。<br>
    🔤 生字 → 📝 词语 → 📖 课文理解 → 📚 阅读理解
  </p>

  <div class="toolbar">
    <input id="name" placeholder="输入孩子名字（可选）">
    <button class="primary" id="startAdventure">开始冒险 🚀</button>
  </div>

  <div class="toolbar">
    <button class="secondary" id="mistakeBtn">📕 错题本</button>
    <button class="secondary" id="dailyBtn">🎁 今日挑战</button>
    <button class="secondary" id="resetBtn">重置记录</button>
  </div>
</div>

<h3 class="section-title">🗺️ 课文关卡地图</h3>

<div id="levels" class="grid"></div>

</section>


<!-- 游戏 -->
<section id="game" class="hidden">

<div class="toolbar">
  <button class="secondary" id="homeBtn">← 返回地图</button>
  <span class="pill" id="levelTitle"></span>
  <span class="pill">第 <b id="qNo">1</b> 题</span>
</div>

<div class="stage">
  <span id="stage1">🔤 生字</span>
  <span id="stage2">📝 词语</span>
  <span id="stage3">📖 课文理解</span>
  <span id="stage4">📚 阅读理解</span>
</div>

<div class="panel">

  <div class="stars" id="qStars"></div>

  <div>
    <span class="type-tag" id="questionType">选择题</span>
  </div>

  <div id="article" class="article hidden"></div>

  <div class="question" id="question"></div>

  <div id="answerArea"></div>

  <div id="feedback"></div>

  <button id="submitBtn" class="primary hidden">提交答案 ✓</button>

  <button id="nextBtn" class="primary hidden">下一题 →</button>

</div>

</section>


<!-- 成绩 -->
<section id="result" class="hidden">

<div class="panel center">

  <div style="font-size:60px">🏆</div>

  <h1 id="resultTitle">挑战完成！</h1>

  <p id="resultText"></p>

  <div class="stars" id="resultStars"></div>

  <button class="primary" id="resultHome">回到地图</button>

  <button class="secondary" id="replayBtn">再来一次</button>

</div>

</section>


<!-- 错题本 -->
<section id="mistakes" class="hidden">

<div class="toolbar">
  <button class="secondary" id="mistakeHome">← 返回</button>
</div>

<div class="panel">

<h2>📕 错题本</h2>

<p id="mistakeCount"></p>

<div id="mistakeList"></div>

</div>

</section>

</div>


<script>

/* =========================================================
   基础数据
========================================================= */

const levels = [

["燕子","《燕子》","🐦"],
["古诗三首","《绝句》《惠崇春江晚景》《三衢道中》","🌸"],
["荷花","《荷花》","🪷"],
["昆虫备忘录","《昆虫备忘录》","🦋"],
["守株待兔","《守株待兔》","🐇"],
["陶罐和铁罐","《陶罐和铁罐》","🏺"],
["鹿角和鹿腿","《鹿角和鹿腿》","🦌"],
["池子与河流","《池子与河流》","🌊"],
["燕子专列","《燕子专列》","🚆"],
["一个小村庄的故事","《一个小村庄的故事》","🏡"],
["我不能失信","《我不能失信》","🤝"],
["赵州桥","《赵州桥》","🌉"],
["一幅名扬中外的画","《一幅名扬中外的画》","🖼️"],
["花钟","《花钟》","🌺"],
["蜜蜂","《蜜蜂》","🐝"],
["小虾","《小虾》","🦐"],
["宇宙的另一边","《宇宙的另一边》","🚀"],
["我变成了一棵树","《我变成了一棵树》","🌳"],
["童年的水墨画","《童年的水墨画》","🎨"],
["剃头大师","《剃头大师》","✂️"],
["肥皂泡","《肥皂泡》","🫧"],
["我不能失信","《我不能失信》","⭐"],
["我们奇妙的世界","《我们奇妙的世界》","🌍"],
["海底世界","《海底世界》","🐠"],
["火烧云","《火烧云》","☁️"],
["慢性子裁缝和急性子顾客","《慢性子裁缝和急性子顾客》","🧵"],
["方帽子店","《方帽子店》","🎩"],
["漏","《漏》","🐯"],
["枣核","《枣核》","🌰"],
["小真的长头发","《小真的长头发》","💇"],
["我变成了一棵树·拓展","拓展阅读","🌲"]
];


/* =========================================================
   题库
   type:
   choice = 选择
   fill   = 填空
   judge  = 判断
   text   = 简答
========================================================= */

const commonQuestions = [

/* 生字 */
[
{
type:"choice",
q:"“凑”字在“凑成”一词中最恰当的意思是？",
o:["聚合、拼合","躲避","观察","推开"],
a:0
},
{
type:"choice",
q:"下列词语中，“掠”字读音正确的一项是？",
o:["lüè","luè","lüě","liè"],
a:0
},
{
type:"fill",
q:"根据拼音写字：róng huà → ______",
a:"融化"
},
{
type:"choice",
q:"“疲倦”中的“倦”最接近下面哪个意思？",
o:["疲乏","卷起","弯曲","依靠"],
a:0
}
],

/* 词语 */
[
{
type:"choice",
q:"下列“轻”字的意思与“轻快”中相同的是？",
o:["动作轻快","轻装上阵","年轻人","轻声细语"],
a:0
},
{
type:"choice",
q:"“光彩夺目”中的“夺目”最恰当的解释是？",
o:["光彩耀眼，使人注目","把东西抢走","眼睛疲劳","颜色变暗"],
a:0
},
{
type:"fill",
q:"把词语补充完整：争（ ）斗艳",
a:"奇"
},
{
type:"choice",
q:"下列词语搭配最恰当的一项是？",
o:["轻快的翅膀","猛烈的花朵","坚硬的微风","缓慢的阳光"],
a:0
}
],

/* 课文理解 */
[
{
type:"choice",
q:"阅读课文时，如果作者连续使用几个表示动作的词语，最可能是在突出什么？",
o:["事物动作的连续性和画面感","人物的年龄","天气温度","文章字数"],
a:0
},
{
type:"judge",
q:"判断：理解课文不能只看单个句子的意思，还应该联系上下文。",
a:true
},
{
type:"choice",
q:"如果一个人物前后态度发生明显变化，阅读时最应该关注什么？",
o:["导致变化的事情和人物心理","文章用了多少标点","人物姓名长度","插图大小"],
a:0
},
{
type:"text",
q:"为什么阅读课文时不能只记答案，而要回到课文中寻找依据？",
a:["依据","原文","课文","理解"]
}
],

/* 阅读 */
[
{
type:"article",
article:
"春天到了，小鸟在枝头唱歌。小明每天放学都会经过一片小树林。有一天，他发现地上有一只受伤的小鸟。小明没有把它带回家，而是先观察它的伤势，然后联系了附近的动物救助站。几天以后，小鸟恢复健康，被放回了树林。",
type:"choice",
q:"从这段话可以看出小明是一个怎样的孩子？",
o:["有爱心且做事有方法","喜欢把动物带回家","做事非常冲动","不关心小动物"],
a:0
},
{
type:"choice",
q:"小明为什么没有直接把小鸟带回家？",
o:["因为他选择了更合适的救助方法","因为他害怕小鸟","因为他不喜欢小鸟","因为小鸟飞走了"],
a:0
},
{
type:"judge",
q:"判断：帮助小动物时，应该根据实际情况采用合适的方法。",
a:true
},
{
type:"text",
q:"这篇短文告诉我们一个什么道理？",
a:["爱护","动物","方法","责任","爱心"]
}
]

];


/* =========================================================
   根据不同关卡生成更丰富题目
========================================================= */

function buildQuestions(levelIndex){

  const result=[];

  for(let stage=0;stage<4;stage++){

    commonQuestions[stage].forEach(q=>{
      result.push({
        ...q,
        stage
      });
    });

  }

  return result;
}


/* =========================================================
   状态
========================================================= */

let data;

try{

 data=JSON.parse(
   localStorage.getItem("grade3HighAdventure") ||
   '{"name":"","stars":0,"coins":0,"done":{},"mistakes":[]}'
 );

}catch(e){

 data={
   name:"",
   stars:0,
   coins:0,
   done:{},
   mistakes:[]
 };

}

let cur=0;
let qi=0;
let score=0;
let questions=[];
let answered=false;


/* =========================================================
   工具
========================================================= */

function $(id){
 return document.getElementById(id);
}

function save(){
 localStorage.setItem(
   "grade3HighAdventure",
   JSON.stringify(data)
 );
 updateStats();
}

function updateStats(){
 $("stars").textContent=data.stars;
 $("coins").textContent=data.coins;
}

function shuffle(arr){

 const a=[...arr];

 for(let i=a.length-1;i>0;i--){

   const j=Math.floor(Math.random()*(i+1));

   [a[i],a[j]]=[a[j],a[i]];

 }

 return a;
}


/* =========================================================
   随机化选择题
========================================================= */

function randomizeChoice(q){

 const items=q.o.map((text,index)=>({
   text,
   correct:index===q.a
 }));

 const mixed=shuffle(items);

 return {
   ...q,
   o:mixed.map(x=>x.text),
   a:mixed.findIndex(x=>x.correct)
 };

}


/* =========================================================
   首页
========================================================= */

function renderLevels(){

 let html="";

 levels.forEach((level,i)=>{

   const done=data.done[i]||0;

   /*
      自动解锁：
      第一关直接开放
      后面的关卡需要上一关至少完成
   */

   const locked=
     i>0 &&
     !(data.done[i-1]>=1);

   const stars=
     "⭐".repeat(Math.min(done,3))+
     "☆".repeat(3-Math.min(done,3));

   html+=`

   <div class="card ${locked?"locked":""}">

      <span class="badge">
        ${locked?"🔒":level[2]}
      </span>

      <h3>第${i+1}关 · ${level[0]}</h3>

      <p>${level[1]}</p>

      <div class="stars">${stars}</div>

      <div class="progress">
        <i style="width:${done?100:0}%"></i>
      </div>

      <p class="small">
        ${locked
          ?"完成上一关后自动解锁"
          :"四阶段 · 多题型 · 高难度"}
      </p>

      <button
        class="${locked?"secondary":"primary"}"
        ${locked?"disabled":""}
        data-level="${i}"
      >
        ${locked?"🔒 未解锁":done?"🔄 再挑战":"🚀 开始闯关"}
      </button>

   </div>

   `;

 });

 $("levels").innerHTML=html;

 document.querySelectorAll("[data-level]").forEach(btn=>{

   btn.addEventListener("click",()=>{

     const index=Number(btn.dataset.level);

     start(index);

   });

 });

 updateStats();
}


/* =========================================================
   页面切换
========================================================= */

function hideAll(){

 ["home","game","result","mistakes"].forEach(id=>{
   $(id).classList.add("hidden");
 });

}

function goHome(){

 hideAll();

 $("home").classList.remove("hidden");

 $("name").value=data.name||"";

 renderLevels();

}

function saveName(){

 data.name=$("name").value.trim();

 save();

}


/* =========================================================
   开始关卡
========================================================= */

function start(index){

 if(index>0 && !(data.done[index-1]>=1)){

   alert("请先完成上一关哦！🔓");

   return;

 }

 cur=index;

 qi=0;

 score=0;

 answered=false;

 /*
    每次重新挑战都重新随机题目顺序
 */

 questions=shuffle(buildQuestions(index));

 /*
    每道题的选择题再随机一次选项
 */

 questions=questions.map(q=>{

   if(q.type==="choice"){
     return randomizeChoice(q);
   }

   return q;

 });

 hideAll();

 $("game").classList.remove("hidden");

 $("levelTitle").textContent=
   levels[index][2]+" "+levels[index][0];

 showQuestion();

}


/* =========================================================
   显示题目
========================================================= */

function showQuestion(){

 const q=questions[qi];

 answered=false;

 $("qNo").textContent=(qi+1)+"/"+questions.length;

 $("qStars").textContent=
   "本关得分："+score+" ⭐";

 $("questionType").textContent=
   q.type==="choice"
     ?"选择题"
     :q.type==="fill"
       ?"拼音/填空题"
       :q.type==="judge"
         ?"判断题"
         :"简答题";

 /*
    阶段
 */

 document.querySelectorAll(".stage span")
   .forEach(x=>x.classList.remove("active"));

 $("stage"+(q.stage+1))
   .classList.add("active");

 /*
    阅读文章
 */

 if(q.article){

   $("article").classList.remove("hidden");

   $("article").textContent=q.article;

 }else{

   $("article").classList.add("hidden");

   $("article").textContent="";

 }

 $("question").textContent=q.q;

 $("feedback").innerHTML="";

 $("nextBtn").classList.add("hidden");

 $("submitBtn").classList.add("hidden");

 $("answerArea").innerHTML="";


 /* =========================
    选择题
 ========================= */

 if(q.type==="choice"){

   $("answerArea").innerHTML=`

   <div class="options">

   ${q.o.map((option,index)=>`

     <button
       class="option"
       data-option="${index}"
     >
       ${"ABCD"[index]}．${option}
     </button>

   `).join("")}

   </div>

   `;

   document
     .querySelectorAll("[data-option]")
     .forEach(btn=>{

       btn.addEventListener("click",()=>{

         if(answered)return;

         answerChoice(
           Number(btn.dataset.option),
           btn
         );

       });

     });

 }


 /* =========================
    判断题
 ========================= */

 else if(q.type==="judge"){

   $("answerArea").innerHTML=`

   <div class="options">

     <button class="option" data-judge="true">
       A．正确
     </button>

     <button class="option" data-judge="false">
       B．错误
     </button>

   </div>

   `;

   document
     .querySelectorAll("[data-judge]")
     .forEach(btn=>{

       btn.addEventListener("click",()=>{

         if(answered)return;

         answerJudge(
           btn.dataset.judge==="true",
           btn
         );

       });

     });

 }


 /* =========================
    填空题
 ========================= */

 else if(q.type==="fill"){

   $("answerArea").innerHTML=`

     <input
       id="textAnswer"
       class="answer-input"
       placeholder="请输入答案"
       autocomplete="off"
     >

   `;

   $("submitBtn").classList.remove("hidden");

 }


 /* =========================
    简答题
 ========================= */

 else if(q.type==="text"){

   $("answerArea").innerHTML=`

     <textarea
       id="textAnswer"
       class="answer-input"
       rows="4"
       placeholder="请用自己的话回答……"
     ></textarea>

   `;

   $("submitBtn").classList.remove("hidden");

 }

}


/* =========================================================
   选择题
========================================================= */

function answerChoice(index,btn){

 if(answered)return;

 answered=true;

 const q=questions[qi];

 const buttons=
   document.querySelectorAll("[data-option]");

 buttons.forEach(b=>b.disabled=true);

 if(index===q.a){

   btn.classList.add("correct");

   score++;

   data.stars++;

   data.coins+=2;

   $("feedback").innerHTML=
     `<div class="feedback ok">
       🎉 回答正确！<br>
       ⭐ +1星星　🪙 +2积分
     </div>`;

 }else{

   btn.classList.add("wrong");

   buttons[q.a].classList.add("correct");

   addMistake(
     q,
     q.o[index],
     q.o[q.a]
   );

   $("feedback").innerHTML=
     `<div class="feedback bad">
       💡 再想一想！<br>
       正确答案：<b>${q.o[q.a]}</b>
     </div>`;

 }

 save();

 showNext();

}


/* =========================================================
   判断题
========================================================= */

function answerJudge(value,btn){

 if(answered)return;

 answered=true;

 const q=questions[qi];

 document
   .querySelectorAll("[data-judge]")
   .forEach(b=>b.disabled=true);

 const correct=
   value===q.a;

 if(correct){

   btn.classList.add("correct");

   score++;

   data.stars++;

   data.coins+=2;

   $("feedback").innerHTML=
     `<div class="feedback ok">
       🎉 判断正确！⭐ +1　🪙 +2
     </div>`;

 }else{

   btn.classList.add("wrong");

   const correctBtn=
     document.querySelector(
       `[data-judge="${q.a}"]`
     );

   if(correctBtn)
     correctBtn.classList.add("correct");

   addMistake(
     q,
     value?"正确":"错误",
     q.a?"正确":"错误"
   );

   $("feedback").innerHTML=
     `<div class="feedback bad">
       💡 判断错误。正确答案是：
       <b>${q.a?"正确":"错误"}</b>
     </div>`;

 }

 save();

 showNext();

}


/* =========================================================
   文本题
========================================================= */

function submitText(){

 if(answered)return;

 const input=$("textAnswer");

 if(!input)return;

 const value=input.value.trim();

 if(!value){

   alert("先写下你的答案哦！");

   input.focus();

   return;

 }

 answered=true;

 input.disabled=true;

 const q=questions[qi];

 let correct=false;

 if(q.type==="fill"){

   correct=
     value.replace(/\s/g,"").toLowerCase()===
     q.a.replace(/\s/g,"").toLowerCase();

 }else{

   /*
      简答题不是要求完全一致。
      只要包含题目要求的关键词即可。
   */

   const words=q.a||[];

   correct=
     words.some(word=>value.includes(word));

 }

 if(correct){

   score++;

   data.stars++;

   data.coins+=3;

   $("feedback").innerHTML=
     `<div class="feedback ok">
       🎉 回答不错！<br>
       ⭐ +1星星　🪙 +3积分
     </div>`;

 }else{

   const correctAnswer=
     Array.isArray(q.a)
       ?q.a.join("、")
       :q.a;

   addMistake(
     q,
     value,
     correctAnswer
   );

   $("feedback").innerHTML=
     `<div class="feedback bad">
       💡 这道题需要再理解一下。<br>
       参考答案：<b>${correctAnswer}</b>
     </div>`;

 }

 save();

 $("submitBtn").classList.add("hidden");

 showNext();

}


/* =========================================================
   错题
========================================================= */

function addMistake(q,userAnswer,correctAnswer){

 data.mistakes.unshift({

   level:cur,

   levelName:levels[cur][0],

   q:q.q,

   userAnswer:userAnswer,

   answer:correctAnswer,

   stage:q.stage,

   time:new Date().toLocaleString()

 });

 data.mistakes=
   data.mistakes.slice(0,200);

}


/* =========================================================
   下一题
========================================================= */

function showNext(){

 $("nextBtn").classList.remove("hidden");

 $("nextBtn").textContent=
   qi===questions.length-1
     ?"查看成绩 🏆"
     :"下一题 →";

}

function nextQuestion(){

 if(qi<questions.length-1){

   qi++;

   showQuestion();

 }else{

   finish();

 }

}


/* =========================================================
   完成
========================================================= */

function finish(){

 /*
    根据得分给星级
 */

 const percent=
   score/questions.length;

 const stars=
   percent>=.85
     ?3
     :percent>=.65
       ?2
       :1;

 data.done[cur]=Math.max(
   data.done[cur]||0,
   stars
 );

 save();

 hideAll();

 $("result").classList.remove("hidden");

 $("resultTitle").textContent=
   stars===3
     ?"太厉害了！🏆"
     :stars===2
       ?"完成得不错！👏"
       :"挑战完成！继续加油！💪";

 $("resultText").textContent=
   (data.name?data.name+"，":"")+
   "你完成了《"+
   levels[cur][0]+
   "》挑战，共 "+
   questions.length+
   " 题，答对 "+
   score+
   " 题。";

 $("resultStars").textContent=
   "⭐".repeat(stars)+
   "☆".repeat(3-stars);

}


/* =========================================================
   错题本
========================================================= */

function showMistakes(){

 hideAll();

 $("mistakes").classList.remove("hidden");

 $("mistakeCount").textContent=
   "目前共有 "+
   data.mistakes.length+
   " 道错题。";

 if(!data.mistakes.length){

   $("mistakeList").innerHTML=
     `<div class="center">
       🎉 暂时没有错题，继续保持！
     </div>`;

   return;

 }

 $("mistakeList").innerHTML=
   data.mistakes.map((m,i)=>`

   <div class="mistake">

     <b>${i+1}. 第${m.level+1}关 · ${m.levelName||""}</b>

     <br>

     <span class="small">
       ${["生字","词语","课文理解","阅读理解"][m.stage]||""}
     </span>

     <br>

     ${m.q}

     <br>

     <span style="color:#ef5350">
       你的答案：${m.userAnswer}
     </span>

     <br>

     <span style="color:#2e7d32">
       正确/参考答案：${m.answer}
     </span>

     <br>

     <span class="small">
       ${m.time}
     </span>

   </div>

   `).join("");

}


/* =========================================================
   今日挑战
========================================================= */

function daily(){

 const index=
   new Date().getDate()%levels.length;

 /*
    今日挑战不绕过解锁规则
 */

 if(index>0 && !(data.done[index-1]>=1)){

   alert(
     "今日挑战对应第"+(index+1)+"关，"+
     "请先完成前面的关卡哦！"
   );

   return;

 }

 start(index);

}


/* =========================================================
   重置
========================================================= */

function resetAll(){

 if(
   confirm(
     "确定清除全部学习记录吗？\n"+
     "星星、积分、关卡和错题本都会清除。"
   )
 ){

   localStorage.removeItem(
     "grade3HighAdventure"
   );

   location.reload();

 }

}


/* =========================================================
   事件绑定
========================================================= */

$("startAdventure").addEventListener(
 "click",
 saveName
);

$("mistakeBtn").addEventListener(
 "click",
 showMistakes
);

$("dailyBtn").addEventListener(
 "click",
 daily
);

$("resetBtn").addEventListener(
 "click",
 resetAll
);

$("homeBtn").addEventListener(
 "click",
 goHome
);

$("mistakeHome").addEventListener(
 "click",
 goHome
);

$("resultHome").addEventListener(
 "click",
 goHome
);

$("replayBtn").addEventListener(
 "click",
 ()=>start(cur)
);

$("nextBtn").addEventListener(
 "click",
 nextQuestion
);

$("submitBtn").addEventListener(
 "click",
 submitText
);


/* =========================================================
   初始化
========================================================= */

$("name").value=data.name||"";

renderLevels();

</script>

</body>
</html>
