<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级语文大冒险</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#fff7df,#e9f7ff);color:#263238}.app{max-width:720px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-size:22px;font-weight:900}.pill,.card,.panel,.hero{background:#fff;border-radius:20px;box-shadow:0 6px 22px #0001}.pill{padding:7px 11px;font-size:13px}.hero,.panel{padding:18px;margin-bottom:14px}.hero h1{font-size:28px;margin:0 0 8px}.hero p{color:#607d8b;line-height:1.6}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.toolbar input{flex:1;min-width:180px;padding:11px;border:1px solid #dce5ea;border-radius:12px}.primary,.secondary{border:0;border-radius:12px;padding:11px 15px;font-weight:bold;cursor:pointer}.primary{background:#ff9f43;color:#fff}.secondary{background:#edf2f5;color:#455a64}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.card{padding:15px;min-height:145px}.badge{float:right;font-size:27px}.card h3{margin:0 0 5px}.card p{font-size:13px;color:#78909c}.stars{color:#ffae00;font-weight:bold;margin:8px 0}.progress{height:8px;background:#e8eef2;border-radius:9px}.progress i{display:block;height:100%;background:#66bb6a;border-radius:9px}.question{font-size:20px;font-weight:bold;line-height:1.55;margin:16px 0}.options{display:grid;gap:9px}.option{padding:13px;border:2px solid transparent;border-radius:13px;background:#f4f7f9;text-align:left;cursor:pointer}.correct{border-color:#66bb6a;background:#effaef}.wrong{border-color:#ef5350;background:#fff0ef}.feedback{margin:12px 0;padding:12px;border-radius:12px}.ok{background:#edf8ef;color:#2e7d32}.bad{background:#fff0ef;color:#c62828}.hidden{display:none}.center{text-align:center}.mistake{margin:9px 0;padding:11px;border-left:5px solid #ff9f43;background:#fafafa;border-radius:9px}@media(max-width:480px){.grid{grid-template-columns:1fr}.hero h1{font-size:25px}.question{font-size:18px}}</style>
<body><div class="app"><div class="top"><div class="brand">📚 三年级语文大冒险</div><div><span class="pill">⭐ <b id=s>0</b></span> <span class=pill>🪙 <b id=c>0</b></span></div></div>
<section id=home><div class=hero><h1>今天也来闯一关！</h1><p>把生字、词语、课文和阅读理解变成小游戏。答对得星星，错题自动保存。</p><div class=toolbar><input id=name placeholder="输入孩子名字（可选）"><button class=primary onclick="saveName()">开始冒险 🚀</button></div><div class=toolbar><button class=secondary onclick="mistakes()">📕 错题本</button><button class=secondary onclick="daily()">🎁 今日挑战</button><button class=secondary onclick="resetAll()">重置记录</button></div></div><div class=grid id=levels></div></section>
<section id=game class=hidden><div class=toolbar><button class=secondary onclick=home()>← 返回地图</button><span class=pill id=lt></span><span class=pill><b id=qn>1</b>/8</span></div><div class=panel><div class=stars id=qs></div><div class=question id=q></div><div class=options id=opts></div><div id=fb></div><button id=next class="primary hidden" onclick=next()>下一题 →</button></div></section>
<section id=result class=hidden><div class="panel center"><div style="font-size:55px">🏆</div><h1 id=rt>闯关成功！</h1><p id=rx></p><div class=stars id=rs></div><button class=primary onclick=home()>回到地图</button> <button class=secondary onclick=replay()>再来一次</button></div></section>
<section id=mistakes class=hidden><div class=toolbar><button class=secondary onclick=home()>← 返回</button></div><div class=panel><h2>📕 错题本</h2><p id=mc></p><div id=ml></div></div></section></div>
<script>
const L=[["字词森林","重点生字词","🌳"],["燕子小镇","课文理解","🐦"],["荷花池","观察想象","🪷"],["昆虫王国","词语搭配","🦋"],["寓言村","故事道理","🦊"],["宇宙探险","科普阅读","🚀"],["传统文化岛","积累运用","🏮"],["阅读城堡","阅读理解","🏰"]];
const sets=[
[["“融化”的“融”最接近？",["融合、消解","寒冷","飞翔","奔跑"],0],["“偶尔”的反义词？",["经常","突然","轻轻","安静"],0],["书写正确的是？",["吹拂","吹佛","吹福","吹服"],0],["“光彩夺目”形容？",["光彩鲜明耀眼","声音很大","速度很快","天气寒冷"],0],["一阵（ ）的微风。",["轻柔","巨大","吵闹","坚硬"],0],["“聚拢”是？",["聚集到一起","散开","停止","跳跃"],0],["适合描写春天的是？",["百花盛开","冰天雪地","烈日炎炎","白雪皑皑"],0],["记生字较好的方法？",["结合词语和句子","只看一遍","完全不读","只记拼音"],0]],
[["燕子的特点更接近？",["活泼可爱","凶猛高大","笨重缓慢","安静孤独"],0],["“剪刀似的尾巴”用了？",["比喻","夸张","排比","拟人"],0],["“掠过”说明？",["快速贴近飞过","慢慢走过","停在地上","一直不动"],0],["朗读课文应？",["读出轻快活泼","每字拖长","大声喊","毫不停顿"],0],["最有画面感的是？",["燕子斜飞于天空","燕子是动物","天空很大","春天到了"],0],["看到燕子飞过的感受？",["轻快喜爱","害怕","生气","厌烦"],0],["燕子的画面适合背景？",["春天田野","冬日冰原","沙漠夜晚","海底"],0],["学完课文应掌握？",["重点词语和主要内容","作者电话","页码颜色","插图编号"],0]],

[["“翩翩起舞”适合描写？",["蝴蝶","石头","书本","桌子"],0],["“轻盈”可以形容？",["动作轻巧","声音巨大","天气炎热","颜色黑暗"],0],["“昆虫”属于？",["事物名称","动作","颜色","数量"],0],["观察昆虫首先？",["细致观察","伤害它们","只看名字","闭眼"],0],["独角仙是？",["昆虫","鸟类","鱼类","植物"],0],["搭配正确的是？",["飞舞的蝴蝶","飞舞的石头","歌唱的铅笔","游泳的太阳"],0],["观察日记可记录？",["时间地点外形动作发现","只一句话","只天气","只姓名"],0],["发现昆虫应？",["文明观察保护环境","捕捉大量","破坏家园","随意带走"],0]],
[["寓言通常？",["故事说明道理","只写天气","只写景色","只列数字"],0],["掩耳盗铃告诉我们？",["不能自欺欺人","铃铛好听","耳朵重要","做事要快"],0],["亡羊补牢的“牢”是？",["羊圈","监牢","牢固","房间"],0],["读寓言重点找？",["故事道理","作者年龄","页码","插图颜色"],0],["犯错后应？",["及时改正","假装没发生","责怪别人","继续犯错"],0],["刻舟求剑说明？",["情况变了办法也要变","船一定快","剑很锋利","水很深"],0],["用自己的话说寓意属于？",["理解概括","机械抄写","朗读比赛","计算"],0],["寓言动物常被？",["赋予人的思想行为","不会行动","只出现一次","不能说话"],0]],
[["太阳属于？",["恒星","行星","卫星","彗星"],0],["地球绕什么运动？",["太阳","月亮","火星","北斗七星"],0],["科普文章常用？",["准确说明事实","夸张故事","只写对话","只写诗歌"],0],["“因为……所以……”表示？",["因果","颜色","人物","时间"],0],["读科学文字概括应？",["抓关键词和中心","逐字背","只第一句","只最后字"],0],["阅读题答案最好？",["有文章依据","凭感觉","越长越好","越复杂越好"],0],["说明性文字关注？",["事实特点原因","人物穿什么","故事感人","对话语气"],0],["不懂的词应该？",["联系上下文或查资料","跳过所有","随便猜","停止阅读"],0]],
[["清明时节雨纷纷描写？",["清明节","春节","端午节","中秋节"],0],["端午习俗？",["赛龙舟吃粽子","赏月","贴春联","堆雪人"],0],["文房四宝？",["笔墨纸砚","琴棋书画","梅兰竹菊","柴米油盐"],0],["雅人四好？",["琴棋书画","笔墨纸砚","梅兰竹菊","风雨雷电"],0],["学传统文化应该？",["理解并运用","只背名称","不理解","只看图片"],0],["美好寓意词语？",["吉祥如意","乱七八糟","怒气冲冲","东倒西歪"],0],["背古诗较好方法？",["理解画面再背","只最后句","只看标题","不读全文"],0],["成语造句帮助？",["真正掌握","忘记词义","减少阅读","避免思考"],0]],
[["阅读短文第一步？",["通读全文了解大意","先看最后题","只看插图","只第一句"],0],["题目问“为什么”找？",["原因和依据","人物姓名","标点数量","段落颜色"],0],["问“主要内容”应？",["概括中心意思","抄全文","一个词","只标题"],0],["“急得像热锅上的蚂蚁”是？",["比喻","拟人","排比","设问"],0],["“但是”通常表示？",["转折","并列","因果","递进"],0],["判断题依据？",["原文证据","个人想象","题目长短","运气"],0],["答错后最好？",["看解析找错因再做","退出","只记答案","跳过"],0],["提高阅读理解要？",["每天读一点并思考","只做难题","只背答案","不读课外"],0]]];
let d=JSON.parse(localStorage.g3||'{"name":"","stars":0,"coins":0,"done":{},"mistakes":[]}'),cur=0,qi=0,score=0,$=x=>document.getElementById(x);
function save(){localStorage.g3=JSON.stringify(d);$("s").textContent=d.stars;$("c").textContent=d.coins}
function render(){levels.innerHTML=L.map((x,i)=>{let z=d.done[i]||0,lock=i>0&&!d.done[i-1];return `<div class=card><span class=badge>${lock?"🔒":x[2]}</span><h3>第${i+1}关 · ${x[0]}</h3><p>${x[1]}</p><div class=stars>${"⭐".repeat(Math.min(z,3))}${"☆".repeat(3-Math.min(z,3))}</div><div class=progress><i style="width:${z?100:0}%></i></div><button class=${lock?"secondary":"primary"} ${lock?"disabled":""} onclick=start(${i})>${lock?"未解锁":z?"再挑战":"开始闯关"}</button></div>`}).join("");save()}
function hide(){["home","game","result","mistakes"].forEach(x=>$(x).classList.add("hidden"))}function home(){hide();$("home").classList.remove("hidden");render()}
function saveName(){d.name=$("name").value.trim();save()}
function start(i){cur=i;qi=0;score=0;hide();$("game").classList.remove("hidden");$("lt").textContent=L[i][2]+" "+L[i][0];showq()}
function showq(){let x=sets[cur][qi];$("qn").textContent=qi+1;$("qs").textContent="本关得分："+score+" ⭐";$("q").textContent=x[0];$("fb").innerHTML="";$("next").classList.add("hidden");$("opts").innerHTML=x[1].map((v,i)=>`<button class=option onclick=ans(${i},this)>${"ABCD"[i]}. ${v}</button>`).join("")}
function ans(i,b){let x=sets[cur][qi];document.querySelectorAll(".option").forEach(z=>z.disabled=true);if(i==x[2]){b.classList.add("correct");score++;d.stars++;d.coins+=2;$("fb").innerHTML='<div class="feedback ok">🎉 答对啦！+1⭐ +2🪙</div>'}else{b.classList.add("wrong");document.querySelectorAll(".option")[x[2]].classList.add("correct");d.mistakes.unshift({level:cur,q:x[0],a:x[1][x[2]],time:new Date().toLocaleString()});d.mistakes=d.mistakes.slice(0,100);$("fb").innerHTML='<div class="feedback bad">💡 正确答案：'+x[1][x[2]]+'</div>'}save();$("next").classList.remove("hidden");$("next").textContent=qi==7?"查看成绩 🏆":"下一题 →"}
function next(){qi<7?(qi++,showq()):finish()}function finish(){d.done[cur]=Math.max(d.done[cur]||0,score>=6?3:score>=4?2:1);save();hide();$("result").classList.remove("hidden");$("rx").textContent=(d.name?d.name+"，":"")+"完成了“"+L[cur][0]+"”，答对 "+score+"/8 题。";$("rs").textContent="⭐".repeat(score>=6?3:score>=4?2:1);$("rt").textContent=score>=6?"太棒了！🎉":score>=4?"完成挑战！💪":"再试一次！🌟"}function replay(){start(cur)}function mistakes(){hide();$("mistakes").classList.remove("hidden");$("mc").textContent="共有 "+d.mistakes.length+" 道错题。";$("ml").innerHTML=d.mistakes.length?d.mistakes.map((m,i)=>`<div class=mistake><b>${i+1}. 第${m.level+1}关</b><br>${m.q}<br>正确答案：<strong>${m.a}</strong><br><small>${m.time}</small></div>`).join(""):"🎉 暂时没有错题！"}function daily(){start(new Date().getDate()%L.length)}function resetAll(){if(confirm("确定清除全部学习记录？")){localStorage.removeItem("g3");location.reload()}}render();
</script></body></html>
