<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ff9f43">
<title>三年级语文大冒险</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  "Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#fff8e8,#eaf7ff);
  color:#263238;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:820px;
  margin:auto;
  min-height:100vh;
  padding:14px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.brand{
  font-size:22px;
  font-weight:900;
}

.stats{
  display:flex;
  gap:6px;
}

.pill{
  background:#fff;
  border-radius:99px;
  padding:7px 11px;
  box-shadow:0 3px 12px #0001;
  font-size:13px;
  white-space:nowrap;
}

.hero,
.panel,
.card{
  background:#fff;
  border-radius:22px;
  padding:18px;
  box-shadow:0 7px 25px #00000012;
}

.hero{
  margin-bottom:14px;
}

.hero h1{
  margin:0 0 8px;
  font-size:29px;
}

.hero p{
  color:#607d8b;
  line-height:1.7;
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:10px 0;
}

.toolbar input{
  flex:1;
  min-width:180px;
  padding:12px;
  border:1px solid #dce5ea;
  border-radius:12px;
  outline:none;
}

.primary,
.secondary,
.danger{
  border:0;
  border-radius:13px;
  padding:11px 15px;
  font-weight:800;
}

.primary{
  background:#ff9f43;
  color:#fff;
}

.secondary{
  background:#eef3f7;
  color:#455a64;
}

.danger{
  background:#ffebee;
  color:#c62828;
}

.primary:active,
.secondary:active{
  transform:scale(.97);
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:12px 0;
}

.summaryBox{
  background:#fff;
  border-radius:18px;
  padding:15px;
  text-align:center;
  box-shadow:0 5px 18px #00000010;
}

.summaryBox .num{
  font-size:25px;
  font-weight:900;
}

.summaryBox .label{
  color:#78909c;
  font-size:12px;
  margin-top:4px;
}

.unitTitle{
  margin:22px 3px 10px;
  font-size:18px;
  font-weight:900;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
}

.card{
  min-height:210px;
  padding:15px;
  position:relative;
}

.card.locked{
  opacity:.55;
  filter:grayscale(.45);
}

.badge{
  position:absolute;
  right:14px;
  top:12px;
  font-size:28px;
}

.card h3{
  margin:0 40px 5px 0;
  font-size:17px;
}

.card p{
  font-size:13px;
  color:#78909c;
  line-height:1.5;
  min-height:39px;
}

.cardStars{
  color:#ffb300;
  font-weight:900;
  margin:8px 0;
}

.progress{
  height:9px;
  background:#e8eef2;
  border-radius:99px;
  overflow:hidden;
  margin:8px 0;
}

.progress i{
  display:block;
  height:100%;
  background:#66bb6a;
  transition:.3s;
}

.stageList{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  margin:10px 0;
}

.stage{
  text-align:center;
  background:#f5f8fa;
  border-radius:8px;
  padding:6px 2px;
  font-size:10px;
}

.stage.done{
  background:#eaf7ec;
  color:#2e7d32;
}

.stage.current{
  background:#fff3e0;
  color:#ef6c00;
  font-weight:900;
}

.stage.locked{
  opacity:.5;
}

.gameHead{
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.questionBox{
  background:#fff;
  border-radius:22px;
  padding:20px;
  box-shadow:0 7px 25px #00000012;
}

.stageTitle{
  font-size:14px;
  color:#ef6c00;
  font-weight:900;
}

.question{
  font-size:20px;
  font-weight:900;
  line-height:1.6;
  margin:16px 0;
}

.options{
  display:grid;
  gap:10px;
}

.option{
  padding:14px;
  border:2px solid transparent;
  border-radius:15px;
  background:#f5f8fa;
  text-align:left;
  transition:.15s;
}

.option:hover{
  background:#eef5f8;
}

.option.correct{
  border-color:#66bb6a;
  background:#effaf0;
}

.option.wrong{
  border-color:#ef5350;
  background:#fff0ef;
}

.option:disabled{
  opacity:1;
}

.feedback{
  margin:14px 0;
  padding:13px;
  border-radius:13px;
  line-height:1.6;
}

.ok{
  background:#edf8ef;
  color:#2e7d32;
}

.bad{
  background:#fff0ef;
  color:#c62828;
}

.hidden{
  display:none!important;
}

.center{
  text-align:center;
}

.bigEmoji{
  font-size:58px;
}

.resultScore{
  font-size:36px;
  font-weight:900;
  color:#ff9f43;
}

.mistake{
  margin:10px 0;
  padding:13px;
  border-left:5px solid #ff9f43;
  background:#fafafa;
  border-radius:10px;
  line-height:1.65;
}

.small{
  font-size:12px;
  color:#78909c;
}

.empty{
  text-align:center;
  padding:30px 10px;
  color:#78909c;
}

.tip{
  background:#fff8e1;
  border-radius:14px;
  padding:12px;
  color:#795548;
  line-height:1.6;
  margin-top:12px;
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }

  .summary{
    grid-template-columns:repeat(3,1fr);
  }

  .hero h1{
    font-size:25px;
  }

  .brand{
    font-size:18px;
  }

  .question{
    font-size:18px;
  }

  .stageList{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:380px){
  .summaryBox{
    padding:11px 5px;
  }

  .summaryBox .num{
    font-size:21px;
  }

  .pill{
    padding:6px 8px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="top">
  <div class="brand">📚 三年级语文大冒险</div>

  <div class="stats">
    <span class="pill">⭐ <b id="stars">0</b></span>
    <span class="pill">🪙 <b id="coins">0</b></span>
  </div>
</header>


<!-- 首页 -->

<section id="home">

  <div class="hero">

    <h1>🌟 开启你的语文冒险</h1>

    <p>
      每一篇课文都是一个独立关卡。
      完成「生字 → 词语 → 课文理解 → 阅读理解」四个阶段，
      一步一步解锁后面的课文。
    </p>

    <div class="toolbar">
      <input id="name" placeholder="输入孩子名字（可选）">
      <button class="primary" onclick="saveName()">
        🚀 开始学习
      </button>
    </div>

    <div class="toolbar">
      <button class="secondary" onclick="showMistakes()">
        📕 错题本
      </button>

      <button class="secondary" onclick="showStats()">
        🏆 学习成就
      </button>

      <button class="danger" onclick="resetAll()">
        重置记录
      </button>
    </div>

  </div>


  <div class="summary">

    <div class="summaryBox">
      <div class="num" id="totalLevels">0</div>
      <div class="label">课文关卡</div>
    </div>

    <div class="summaryBox">
      <div class="num" id="finishedLevels">0</div>
      <div class="label">已完成</div>
    </div>

    <div class="summaryBox">
      <div class="num" id="totalQuestions">0</div>
      <div class="label">已答题</div>
    </div>

  </div>


  <div id="levels"></div>

</section>


<!-- 游戏 -->

<section id="game" class="hidden">

  <div class="gameHead">

    <button class="secondary" onclick="goHome()">
      ← 返回地图
    </button>

    <span class="pill" id="gameLevel"></span>

    <span class="pill">
      第 <b id="qNo">1</b> 题
    </span>

  </div>


  <div class="questionBox">

    <div class="stageTitle" id="stageTitle"></div>

    <div class="question" id="question"></div>

    <div class="options" id="options"></div>

    <div id="feedback"></div>

    <button
      id="nextBtn"
      class="primary hidden"
      onclick="nextQuestion()">
      下一题 →
    </button>

  </div>

</section>


<!-- 阶段完成 -->

<section id="stageResult" class="hidden">

  <div class="panel center">

    <div class="bigEmoji">🎉</div>

    <h1 id="stageResultTitle">阶段完成！</h1>

    <p id="stageResultText"></p>

    <div class="resultScore" id="stageResultScore"></div>

    <div class="stars" id="stageResultStars"></div>

    <div class="toolbar" style="justify-content:center">

      <button class="primary" onclick="continueLevel()">
        继续挑战 →
      </button>

      <button class="secondary" onclick="goHome()">
        回到地图
      </button>

    </div>

  </div>

</section>


<!-- 错题本 -->

<section id="mistakes" class="hidden">

  <div class="toolbar">
    <button class="secondary" onclick="goHome()">
      ← 返回
    </button>
  </div>

  <div class="panel">

    <h2>📕 我的错题本</h2>

    <p id="mistakeCount"></p>

    <div id="mistakeList"></div>

  </div>

</section>


<!-- 成就 -->

<section id="achievement" class="hidden">

  <div class="toolbar">
    <button class="secondary" onclick="goHome()">
      ← 返回
    </button>
  </div>

  <div class="panel">

    <div class="center">

      <div class="bigEmoji">🏆</div>

      <h2>我的学习成就</h2>

      <p id="achievementText"></p>

    </div>

    <div class="tip">
      🌟 不需要一次全部学完。
      每天完成一小关，坚持下去，就会越来越厉害！
    </div>

  </div>

</section>

</div>

    },
    {
      q:"题目问“主要内容”，应该怎样回答？",
      options:["概括文章中心意思","抄完整篇文章","只写一个字","只写标题"],
      answer:"概括文章中心意思"
    },
    {
      q:"阅读理解中的判断题最好依据什么？",
      options:["原文证据","个人猜测","运气","题目长度"],
      answer:"原文证据"
    },
    {
      q:"看到“但是、可是”，通常表示什么关系？",
      options:["转折","因果","并列","递进"],

    {
      q:"第一次答错后，最好的学习方法是？",

};


/* =========================================================
   4. 本地数据
   ========================================================= */

const STORAGE_KEY="grade3AdventureV2";

let data;

try{
  data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"");
}catch(e){
  data=null;
}

if(!data){

  data={
    name:"",
    stars:0,
    coins:0,
    answered:0,
    levels:{},
    mistakes:[]
  };

}


/* =========================================================
   5. 当前游戏状态
   ========================================================= */

let currentLevel=0;
let currentStage=0;
let currentQuestion=0;
let currentScore=0;
let currentQuestions=[];


/* =========================================================
   6. 工具
   ========================================================= */

function $(id){
  return document.getElementById(id);
}


function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

  updateStats();
}


function updateStats(){

  $("stars").textContent=data.stars;
  $("coins").textContent=data.coins;

}


function hideAll(){

  [
    "home",
    "game",
    "stageResult",
    "mistakes",
    "achievement"
  ].forEach(id=>{
    $(id).classList.add("hidden");
  });

}


function goHome(){

  hideAll();

  $("home").classList.remove("hidden");

  $("name").value=data.name||"";

  renderLevels();

}


/* =========================================================
   7. 初始化关卡数据
   ========================================================= */

function getLevelData(index){

  if(!data.levels[index]){

    data.levels[index]={
      stage:[0,0,0,0],
      unlocked:index===0
    };

  }

  return data.levels[index];

}


/* =========================================================
   8. 判断解锁
   ========================================================= */

function isUnlocked(index){

  if(index===0) return true;

  const previous=getLevelData(index-1);

  return previous.stage.every(x=>x>=1);

}


/* =========================================================
   9. 计算关卡进度
   ========================================================= */

function levelProgress(index){

  const d=getLevelData(index);

  const completed=d.stage.filter(x=>x>=1).length;

  return completed;

}


/* =========================================================
   10. 地图
   ========================================================= */

function renderLevels(){

  let html="";
  let currentUnit="";

  lessons.forEach((lesson,index)=>{

    if(lesson.unit!==currentUnit){

      currentUnit=lesson.unit;

      html+=`
        <div class="unitTitle">
          ${currentUnit}
        </div>
      `;

    }

    const unlocked=isUnlocked(index);
    const d=getLevelData(index);
    const completed=levelProgress(index);

    let percent=Math.round(completed/4*100);

    let stars="";

    if(completed===4){
      stars="⭐⭐⭐";
    }else if(completed>0){
      stars="⭐"+"☆".repeat(2);
    }else{
      stars="☆☆☆";
    }

    html+=`

      <div class="card ${unlocked?"":"locked"}">

        <div class="badge">
          ${unlocked?lesson.icon:"🔒"}
        </div>

        <h3>
          第${index+1}关 · ${lesson.title}
        </h3>

        <p>
          ${lesson.desc}
        </p>

        <div class="cardStars">
          ${stars}
        </div>

        <div class="stageList">

          ${stages.map((s,i)=>{

            let done=d.stage[i]>=1;

            return `
              <div class="stage
                ${done?"done":""}
                ${!done&&i===completed&&unlocked?"current":""}
                ${!unlocked?"locked":""}">
                ${done?"✓":s.icon}<br>${s.name}
              </div>
            `;

          }).join("")}

        </div>

        <div class="progress">
          <i style="width:${percent}%"></i>
        </div>

        <button
          class="${unlocked?"primary":"secondary"}"
          ${unlocked?"":"disabled"}
          onclick="openLevel(${index})">

          ${
            !unlocked
            ?"🔒 未解锁"
            :completed===4
              ?"🔄 再挑战"
              :"🚀 开始学习"
          }

        </button>

      </div>
    `;

  });

  $("levels").innerHTML=html;

  $("totalLevels").textContent=lessons.length;

  $("finishedLevels").textContent=
    lessons.filter((_,i)=>levelProgress(i)===4).length;

  $("totalQuestions").textContent=data.answered;

  updateStats();

}


/* =========================================================
   11. 进入关卡
   ========================================================= */

function openLevel(index){

  if(!isUnlocked(index)) return;

  currentLevel=index;

  const d=getLevelData(index);

  let stage=d.stage.findIndex(x=>x<1);

  if(stage===-1){

    stage=0;

  }

  currentStage=stage;

  startStage();

}


/* =========================================================
   12. 开始阶段
   ========================================================= */

function startStage(){

  currentQuestion=0;
  currentScore=0;

  const lesson=lessons[currentLevel];
  const stage=stages[currentStage];

  currentQuestions=
    createQuestions(
      currentLevel,
      currentStage
    );

  hideAll();

  $("game").classList.remove("hidden");

  $("gameLevel").textContent=
    lesson.icon+" 第"+(currentLevel+1)+"关 · "+lesson.title;

  $("stageTitle").textContent=
    stage.icon+" "+stage.name+"训练";

  showQuestion();

}


/* =========================================================
   13. 生成题目
   ========================================================= */

function createQuestions(levelIndex,stageIndex){

  const stageId=stages[stageIndex].id;

  let base=
    commonQuestions[stageId].map(q=>({
      q:q.q,
      options:[...q.options],
      answer:q.answer
    }));

  const lesson=lessons[levelIndex];

  /*
    每一篇课文增加一道与本课关键词相关的题目。
  */

  if(stageIndex===0){

    base.push({
      q:`《${lesson.title}》学习时，最应该重点关注什么？`,
      options:[
        lesson.keywords[0],
        "电话号码",
        "商品价格",
        "天气预报"
      ],
      answer:lesson.keywords[0]
    });

  }

  if(stageIndex===1){

    base.push({
      q:`下面哪个词语最适合与“${lesson.keywords[0]}”联系起来学习？`,
      options:[
        lesson.keywords[0],
        "火车票",
        "数学公式",
        "足球比赛"
      ],
      answer:lesson.keywords[0]
    });

  }

  if(stageIndex===2){

    base.push({
      q:`学习《${lesson.title}》时，理解重点句子的好方法是？`,
      options:[
        "联系上下文",
        "只背答案",
        "只看插图",
        "不读课文"
      ],
      answer:"联系上下文"
    });

  }

  if(stageIndex===3){

    base.push({
      q:`阅读关于《${lesson.title}》的材料时，答案最好依据什么？`,
      options:[
        "文章中的信息",
        "自己的猜测",
        "答案长短",
        "随机选择"
      ],
      answer:"文章中的信息"
    });

  }

  /*
    随机抽取 8 道。
  */

  shuffle(base);

  return base.slice(0,8);

}


/* =========================================================
   14. Fisher-Yates 随机
   ========================================================= */

function shuffle(arr){

  for(let i=arr.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [arr[i],arr[j]]=[arr[j],arr[i]];

  }

  return arr;

}


/* =========================================================
   15. 显示题目
   ========================================================= */

function showQuestion(){

  const q=currentQuestions[currentQuestion];

  $("qNo").textContent=
    (currentQuestion+1)+"/"+currentQuestions.length;

  $("question").textContent=q.q;

  $("feedback").innerHTML="";

  $("nextBtn").classList.add("hidden");

  /*
    这里真正随机打乱选项。

    正确答案保存为文字，
    所以不怕答案位置发生变化。
  */

  const options=shuffle([...q.options]);

  $("options").innerHTML=
    options.map((option,index)=>{

      return `
        <button
          class="option"
          onclick="answerQuestion(this,${JSON.stringify(option)})">

          ${String.fromCharCode(65+index)}.
          ${option}

        </button>
      `;

    }).join("");

}


/* =========================================================
   16. 答题
   ========================================================= */

function answerQuestion(button,selected){

  const q=currentQuestions[currentQuestion];

  document
    .querySelectorAll(".option")
    .forEach(b=>b.disabled=true);

  data.answered++;

  if(selected===q.answer){

    button.classList.add("correct");

    currentScore++;

    data.stars++;
    data.coins+=10;

    $("feedback").innerHTML=`
      <div class="feedback ok">
        🎉 答对啦！

        <br>
        ⭐ +1 星星
        &nbsp;&nbsp;
        🪙 +10 积分
      </div>
    `;

  }else{

    button.classList.add("wrong");

    document
      .querySelectorAll(".option")
      .forEach(b=>{

        if(
          b.textContent
           .replace(/^[A-D]\.\s*/,"")
           .trim()
           ===q.answer
        ){
          b.classList.add("correct");
        }

      });

    data.mistakes.unshift({

      level:currentLevel,

      levelTitle:lessons[currentLevel].title,

      stage:currentStage,

      stageTitle:stages[currentStage].name,

      question:q.q,

      selected:selected,

      answer:q.answer,

      time:new Date().toLocaleString()

    });

    data.mistakes=
      data.mistakes.slice(0,200);

    $("feedback").innerHTML=`
      <div class="feedback bad">

        💡 再想一想！

        <br>
        你的答案：${selected}

        <br>
        正确答案：
        <strong>${q.answer}</strong>

      </div>
    `;

  }

  save();

  $("nextBtn").classList.remove("hidden");

  $("nextBtn").textContent=
    currentQuestion===currentQuestions.length-1
      ?"完成本阶段 🏆"
      :"下一题 →";

}


/* =========================================================
   17. 下一题
   ========================================================= */

function nextQuestion(){

  if(currentQuestion<currentQuestions.length-1){

    currentQuestion++;

    showQuestion();

  }else{

    finishStage();

  }

}


/* =========================================================
   18. 阶段完成
   ========================================================= */

function finishStage(){

  const score=currentScore;

  const d=getLevelData(currentLevel);

  /*
    6/8 以上即可完成阶段。
    防止孩子因为一题错了就无法继续。
  */

  const passed=score>=6;

  if(passed){

    d.stage[currentStage]=1;

    data.coins+=30;

    data.stars+=2;

  }

  save();

  hideAll();

  $("stageResult").classList.remove("hidden");

  const lesson=lessons[currentLevel];
  const stage=stages[currentStage];

  $("stageResultTitle").textContent=
    passed
      ?"🎉 阶段完成！"
      :"💪 再试一次";

  $("stageResultText").innerHTML=
    `
      ${data.name?data.name+"，":""}

      你完成了
      <strong>《${lesson.title}》</strong>
      的
      <strong>${stage.name}</strong>
      训练。

      <br><br>

      本阶段答对
      <strong>${score}/${currentQuestions.length}</strong>
      题。

    `;

  $("stageResultScore").textContent=
    score+"/"+currentQuestions.length;

  $("stageResultStars").textContent=
    passed
      ?"⭐⭐⭐"
      :"⭐☆☆";

}


/* =========================================================
   19. 继续
   ========================================================= */

function continueLevel(){

  const d=getLevelData(currentLevel);

  if(d.stage[currentStage]){

    if(currentStage<3){

      currentStage++;

      startStage();

    }else{

      /*
        四阶段全部完成
      */

      goHome();

    }

  }else{

    startStage();

  }

}


/* =========================================================
   20. 保存名字
   ========================================================= */

function saveName(){

  data.name=
    $("name").value.trim();

  save();

  renderLevels();

}


/* =========================================================
   21. 错题本
   ========================================================= */

function showMistakes(){

  hideAll();

  $("mistakes").classList.remove("hidden");

  $("mistakeCount").textContent=
    "目前共有 "+data.mistakes.length+" 道错题。";

  if(!data.mistakes.length){

    $("mistakeList").innerHTML=`
      <div class="empty">
        🎉 暂时没有错题！

        <br><br>

        继续保持！
      </div>
    `;

    return;

  }

  $("mistakeList").innerHTML=
    data.mistakes.map((m,index)=>{

      return `
        <div class="mistake">

          <b>
            ${index+1}.
            第${m.level+1}关 ·
            《${m.levelTitle}》
          </b>

          <br>

          <span>
            ${m.stageTitle}
          </span>

          <br><br>

          ${m.question}

          <br>

          <span class="small">
            你的答案：
          </span>

          ${m.selected}

          <br>

          <span class="small">
            正确答案：
          </span>

          <strong>${m.answer}</strong>

          <br>

          <span class="small">
            ${m.time}
          </span>

        </div>
      `;

    }).join("");

}


/* =========================================================
   22. 成就
   ========================================================= */

function showStats(){

  hideAll();

  $("achievement").classList.remove("hidden");

  const finished=
    lessons.filter(
      (_,i)=>levelProgress(i)===4
    ).length;

  const progress=
    Math.round(
      finished/lessons.length*100
    );

  $("achievementText").innerHTML=`

    <strong>${data.name||"小勇士"}</strong>

    <br><br>

    ⭐ 星星：
    <strong>${data.stars}</strong>

    <br>

    🪙 积分：
    <strong>${data.coins}</strong>

    <br>

    📚 完成课文：
    <strong>${finished}/${lessons.length}</strong>

    <br>

    📈 总进度：
    <strong>${progress}%</strong>

    <br>

    📕 错题：
    <strong>${data.mistakes.length}</strong>

  `;

}


/* =========================================================
   23. 重置
   ========================================================= */

function resetAll(){

  if(
    confirm(
      "确定要清除所有学习记录吗？\n\n星星、积分、解锁和错题都会清除。"
    )
  ){

    localStorage.removeItem(STORAGE_KEY);

    location.reload();

  }

}


/* =========================================================
   24. 启动
   ========================================================= */

$("name").value=data.name||"";

renderLevels();

</script>
